; Standards catch-up C-3.
;
; The extension directory name contains a dash, so mypy cannot treat it as a
; package; the backend modules are checked file-wise instead. `check_untyped_defs`
; catches real defects inside bodies even where signatures are still loose;
; `disallow_untyped_defs` is left off deliberately - annotating ~3k lines of
; aiohttp handlers is a dedicated follow-up, not part of this pass.
[mypy]
python_version = 3.11
files = py/utils.py, py/auth.py, py/config.py, py/thread.py, py/manager.py, py/download.py, py/upload.py, py/upload_hf.py, py/information.py, py/compress.py
ignore_missing_imports = True
explicit_package_bases = True
mypy_path = .
namespace_packages = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
