; Deliberately located INSIDE tests/: pytest resolves rootdir (and with it
; confcutdir) from the nearest ini file to the collected args, so running
; `python -m pytest tests` picks THIS file, sets rootdir=tests/ and keeps the
; repository root out of the collector ancestor chain. That matters because
; the repository root carries an `__init__.py` (the ComfyUI extension runtime
; entry point) and pytest >= 8 would otherwise treat the root as a test
; Package and try to import that entry point during setup (relative `.py`
; imports -> ImportError). See the root conftest.py for the fallback guard
; when pytest is invoked from the repository root without args.
[pytest]
