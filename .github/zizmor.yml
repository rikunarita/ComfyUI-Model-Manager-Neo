# zizmor configuration — see https://docs.zizmor.sh/configuration/
#
# Policy (permanent record: Agent/MEMO.md §11): every ignore below is
# line-scoped and carries
# its justification. Line-scoped ignores are deliberately brittle: when
# native.yml shifts, a suppressed finding RE-APPEARS and forces re-review
# (fail-safe direction). Re-run `zizmor --offline .github` after any workflow
# edit and refresh the line numbers here if — and only if — the justification
# still holds.
#
# NOT ignored here (handled in the workflows themselves):
#   - template-injection: fixed via env bindings (2026-10-07)
#   - artipacked: persist-credentials: false everywhere; the single publish-bot
#     checkout carries an inline `# zizmor: ignore[artipacked]` with its reason
#   - adhoc-packages: inline ignore with reason (typescript@6.0.3 cross-check)
#   - excessive-permissions: top-level `permissions: contents: read` added

rules:
  unpinned-uses:
    # Project policy (Agent/MEMO.md §11): dtolnay/rust-toolchain's @stable /
    # @nightly are BRANCHES by design — this project's toolchain policy is
    # deliberately version-floating (Agent/MEMO §10: "dtolnay/rust-toolchain
    # @stable・バージョンピン無しの方針どおり"; toolchain drift is caught by
    # the CI gates themselves — precedent: the clippy 1.99 drift fix 5fa3679).
    # SHA-pinning would freeze the toolchain and contradict that policy, so
    # these two refs are held at ref-pin; everything else stays on zizmor's
    # default hash-pin policy (restated explicitly so the exception is
    # visible). The branch heads are annotated in the workflows and rotate;
    # the annotation dates the last audit.
    config:
      policies:
        dtolnay/rust-toolchain: ref-pin
        "*": hash-pin

  cache-poisoning:
    # native.yml is flagged because its `tags: v*` trigger makes it a
    # "release workflow" that reads CI caches. Both primitives are already
    # mitigated in the workflow itself (2026-10-07):
    #   1. WRITES are restricted to trusted events by every rust-cache
    #      `save-if` (non-PR pushes to main/dev only — the authoritative
    #      comment lives at native.yml's native-test rust-cache step);
    #   2. READS on tag runs are disabled: rust-cache steps are skipped and
    #      setup-uv gets `enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}`,
    #      so release verification builds COLD — exactly zizmor's primary
    #      remediation ("release workflows should not read from the cache").
    # zizmor does not evaluate those conditional expressions (all findings
    # report confidence=Low; the suggested `lookup-only` auto-fix
    # would break the main/dev cache-save policy, so it is refused).
    # Re-evaluation history: zizmor 1.31.1 was MEASURED on 2026-10-20 with
    # these ignores stripped — the findings returned, i.e. 1.31's new
    # awareness covers only GitHub's native `cache-mode` field (static,
    # workflow/job level — unusable here because it cannot vary per event),
    # NOT per-step conditional expressions. Ignores stay; next re-evaluation
    # when zizmor recognizes conditional disable patterns, or if this
    # workflow ever adopts cache-mode. Line numbers refreshed 2026-10-31
    # after the UV_MALWARE_CHECK env insertions shifted native.yml (7 of 11
    # findings re-appeared at the shifted lines exactly as this fail-safe
    # policy describes; re-verified with zizmor --offline, justifications
    # unchanged).
    # Line numbers refreshed again 2026-11-28: the Windows ARM64 job
    # (native-build-windows-arm64, 695–796) inserted ~102 lines after
    # native-build-windows, shifting every later step down. All 11 prior
    # ignores re-verified one-by-one against the current lines — same job,
    # same step kind, same mitigation (rust-cache: `if: !tags` + `save-if`
    # non-PR main/dev only; setup-uv: `enable-cache` tags-disabled) — and
    # re-pointed. The integration-job setup-uv ignore formerly labelled
    # "abi3-import matrix" now points at integration's setup-uv (line 1044);
    # abi3-import carries no setup-uv at all. The two NEW findings introduced
    # by the ARM64 job (721 rust-cache / 735 setup-uv) carry the identical
    # mitigation and are added with the same justification. re-verified with
    # `zizmor --offline .github` at 1.31.1: 13 findings -> 0.
    ignore:
      - native.yml:142 # Swatinem/rust-cache (native-test) — if: !tags + save-if
      - native.yml:291 # Swatinem/rust-cache (native-build-linux)
      - native.yml:305 # astral-sh/setup-uv (native-build-linux) — enable-cache conditional
      - native.yml:502 # Swatinem/rust-cache (native-build-macos)
      - native.yml:515 # astral-sh/setup-uv (native-build-macos)
      - native.yml:618 # Swatinem/rust-cache (native-build-windows)
      - native.yml:631 # astral-sh/setup-uv (native-build-windows)
      - native.yml:721 # Swatinem/rust-cache (native-build-windows-arm64) — new 2026-11-28; same mitigation
      - native.yml:735 # astral-sh/setup-uv (native-build-windows-arm64) — new 2026-11-28; same mitigation
      - native.yml:1044 # astral-sh/setup-uv (integration) — enable-cache conditional
      - native.yml:1198 # Swatinem/rust-cache (fuzz-smoke)
      - native.yml:1292 # Swatinem/rust-cache (pgo-measure)
      - native.yml:1304 # astral-sh/setup-uv (pgo-measure)
