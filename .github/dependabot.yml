# Dependabot version updates (added 2026-10-07; permanent record: Agent/MEMO.md §11).
#
# Activation: GitHub reads this file FROM THE DEFAULT BRANCH — it takes effect
# once merged to main (user-exclusive step). Version-update PRs target `dev`
# (the working branch, per the project's standing rule); Dependabot SECURITY
# updates (the settings toggle) always target the default branch `main` —
# after merging one there, port the same bump to dev (cherry-pick) so the dev
# security gates stay green (Agent/MEMO.md §11).
#
# NOT configured (deliberate — Agent/MEMO.md §11): the `pip` ecosystem.
# requirements.txt is the runtime contract kept in SYNC with pyproject.toml
# (equality pinned mechanically by tests/test_phase8_distribution.py); a
# Dependabot edit to either file alone would break that parity. Python moves
# through the `uv` ecosystem below (pyproject.toml + uv.lock together), and
# requirements.txt follows by the established manual-sync rule.
version: 2
updates:
  # ---- frontend (pnpm-lock.yaml) ------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      # UTC — after the Monday 03:00 security scans
      time: "04:00"
    # Supply-chain cooldown (zizmor dependabot-cooldown, recommended 7 days):
    # never auto-propose a version published less than a week ago — the same
    # philosophy as the pnpm minimumReleaseAge gate (Agent/MEMO §4.1) and the
    # dependency-cooldown practice uv's own security post recommends.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    groups:
      # Grouped PRs keep the weekly noise to at most two per ecosystem.
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # The whole tree is pinned to the 6.x TypeScript toolchain by BOTH
      # package.json ("typescript": "6.0.3") and the pnpm-workspace.yaml
      # override (user decision 2026-09-29 — TypeScript 7 excluded
      # project-wide). Dependabot cannot move the pin and the override
      # together, so TypeScript updates stay a manual, coordinated edit.
      - dependency-name: typescript
      # frontend-types >= 1.58 is blocked on UPSTREAM, re-verified 2026-10-31
      # with measured evidence (full analysis + migration triggers:
      # Agent/MEMO.md §16):
      #   1. Every release <= 1.58.0 is an EMPTY STUB — tarballs contain only
      #      LICENSE + package.json; the declared index.d.ts is absent
      #      (measured: 1.50.0, 1.54.9, 1.55.18, 1.57.0–1.57.6, 1.58.0).
      #      Real declarations first shipped in 1.58.1 / 1.59.1 / 1.60.0.
      #   2. In >= 1.58, `Settings` is a CLOSED type alias (~160 literal
      #      ComfyUI keys; no index signature, no declaration merging), so
      #      the extension's custom "ModelManager.*" keys cannot satisfy
      #      `keyof Settings` (PR #93 on 1.59.1: 10+ typecheck errors across
      #      src/hooks/*, App.vue, DialogCreateTask.vue). Upstream's own
      #      deprecation example (`id: 'My.Setting'`) fails their own type.
      #   3. The >= 1.58 index.d.ts imports undeclared deps
      #      (@comfyorg/object-info-parser, ingest-types, account-core,
      #      billing-contract, vue-component-type-helpers) — ComfyNodeDef &
      #      friends silently degrade to `any` without extra devDeps.
      #   4. Runtime alignment: ComfyUI stable (v0.43.0) ships
      #      comfyui-frontend-package 1.57.4, master pins 1.57.6, and npm's
      #      `latest` dist-tag IS 1.57.6 — users run the 1.57.x frontend,
      #      whose API the >= 1.58 types do not describe.
      # The pin stays on the aligned 1.57.x channel (now 1.57.6). Remove this
      # ignore when a MEMO §16 trigger fires (stable ComfyUI ships >= 1.58,
      # npm latest flips, upstream restores 1.57-line types, or adds a
      # Settings extension point).
      - dependency-name: "@comfyorg/comfyui-frontend-types"
        versions: [">= 1.58"]

  # ---- Rust native core (native/Cargo.lock) --------------------------------
  - package-ecosystem: cargo
    directory: "/native"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # Supply-chain cooldown (zizmor dependabot-cooldown, recommended 7 days):
    # never auto-propose a version published less than a week ago — the same
    # philosophy as the pnpm minimumReleaseAge gate (Agent/MEMO §4.1) and the
    # dependency-cooldown practice uv's own security post recommends.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(native)"

  # ---- Python dev/CI layer (pyproject.toml + uv.lock) ----------------------
  # Dependabot's uv ecosystem updates pyproject.toml and uv.lock together
  # (officially supported since 2025-03-13; Astral publishes the guide).
  - package-ecosystem: uv
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # Supply-chain cooldown (zizmor dependabot-cooldown, recommended 7 days):
    # never auto-propose a version published less than a week ago — the same
    # philosophy as the pnpm minimumReleaseAge gate (Agent/MEMO §4.1) and the
    # dependency-cooldown practice uv's own security post recommends.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(py)"

  # ---- CI itself (SHA-pinned actions & reusable workflows) -----------------
  # Dependabot updates SHA pins in place (keeping the `# vX.Y.Z` comments),
  # which is what keeps the Step-4 hash-pinning from going stale. The
  # dtolnay/rust-toolchain BRANCH refs (@stable/@nightly, floating by policy
  # — Agent/MEMO.md §11) carry no version semantics and are left alone;
  # should a PR ever propose touching them, close it.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # Supply-chain cooldown (zizmor dependabot-cooldown, recommended 7 days):
    # never auto-propose a version published less than a week ago — the same
    # philosophy as the pnpm minimumReleaseAge gate (Agent/MEMO §4.1) and the
    # dependency-cooldown practice uv's own security post recommends.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
