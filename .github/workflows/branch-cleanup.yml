# Merged-branch hygiene.
#
# The repository setting `delete_branch_on_merge` is enabled, so GitHub deletes
# a PR's head branch automatically when the PR merges through the UI/API — but
# that switch only covers merges GitHub performs itself. This workflow is the
# belt to that braces: on every closed PR it deletes the head branch when the
# PR was merged, so branches merged by any other route (or created before the
# setting was flipped) are reclaimed too.
#
# Safety properties (all enforced in the run script, not by convention):
#   * only `merged == true` PRs trigger deletion — closing an unmerged PR
#     never deletes its branch;
#   * the head branch must live in THIS repository (fork heads are never
#     touched — they do not exist here anyway);
#   * `main` and `dev` are hard-coded skip-list entries;
#   * a 404/422 from the delete call (already gone, e.g. the repo setting
#     fired first) is treated as success, anything else fails loudly.
name: branch-cleanup

on:
  pull_request:
    types: [closed]

# Nothing in this workflow reads the repository contents; it only deletes a
# ref through the REST API.
permissions: {}

concurrency:
  group: branch-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  delete-head:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Deleting a ref through the REST API needs contents:write.
      contents: write
    steps:
      - name: Delete merged head branch
        env:
          # The runner does NOT export GITHUB_TOKEN into step environments on
          # its own — pass it explicitly (same rule as security.yml /
          # cache-cleanup.yml).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "head ref lives in a fork ($HEAD_REPO) — nothing to delete here"
            exit 0
          fi
          case "$HEAD_REF" in
            main|dev)
              echo "protected branch '$HEAD_REF' — skipping"
              exit 0
              ;;
          esac
          echo "Deleting merged branch '$HEAD_REF'"
          code=$(curl -s -o /tmp/branch-cleanup-response.json -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${BASE_REPO}/git/refs/heads/${HEAD_REF}")
          case "$code" in
            204) echo "deleted" ;;
            404|422) echo "already gone (HTTP $code) — fine" ;;
            *)
              echo "unexpected HTTP $code while deleting '$HEAD_REF'"
              cat /tmp/branch-cleanup-response.json
              exit 1
              ;;
          esac
