# Continuous integration: static checks + production build.
#
# NOTE: pnpm's version is taken from `packageManager` in package.json - passing
# `version:` to pnpm/action-setup as well makes the action abort with
# ERR_PNPM_BAD_PM_VERSION ("Multiple versions of pnpm specified").
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # no `version:` on purpose - see the header note

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mypy ruff==0.16.8

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint CSS (Stylelint)
        run: pnpm lint:css

      - name: Dependency graph (dependency-cruiser)
        run: pnpm deps

      - name: Format
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Static types (mypy)
        run: python -m mypy --config-file mypy.ini

      - name: Python lint (ruff)
        run: ruff check py __init__.py

      - name: Python format (ruff)
        run: ruff format --check py __init__.py
