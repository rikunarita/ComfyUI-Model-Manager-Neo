# Continuous integration: static checks + production build.
#
# NOTE: pnpm's version is taken from `packageManager` in package.json - passing
# `version:` to pnpm/action-setup as well makes the action abort with
# ERR_PNPM_BAD_PM_VERSION ("Multiple versions of pnpm specified").
name: CI

on:
  push:
    # `dev` is the working branch of the Rust-native refresh (Agent/Plan.md):
    # every push there gets the same verification a PR to main would.
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # no `version:` on purpose - see the header note

      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Plan Phase 7 T4: uv replaces pip in the CI layer - a drop-in
      # `uv pip install --system` (8-100x faster resolve+install) against the
      # setup-python interpreter. The RUNTIME contract is untouched:
      # requirements.txt (read by ComfyUI / ComfyUI-Manager) and
      # __init__.py -> utils.pip_install still run inside the USER's ComfyUI
      # Python, where uv cannot be assumed. `enable-cache` persists uv's
      # download cache (keyed on requirements.txt / pyproject.toml / uv.lock).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Python dependencies
        run: uv pip install --system -r requirements.txt mypy ruff==0.16.9 pytest pytest-asyncio aiohttp pyyaml requests pillow

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint CSS (Stylelint)
        run: pnpm lint:css

      - name: Dependency graph (dependency-cruiser)
        run: pnpm deps

      # Fallow (codebase intelligence): the documented "zero unused exports,
      # zero duplication" invariant (README §Fallow). It is the graph-hygiene
      # sibling of dependency-cruiser above. `unused-exports` / `unused-files` /
      # `unresolved-imports` are ERROR-level in .fallowrc.json (a non-zero exit
      # fails this step); `unused-types` / `private-type-leaks` are warnings and
      # the remaining pnpm-workspace.yaml override (typescript) targets a declared
      # devDependency, so fallow does not flag it and a clean tree exits 0. (The
      # former desktop-bridge-types override was removed 2026-09-30 once
      # comfyui-frontend-types 1.54.9 required 0.2.0 directly, making it redundant.)
      # Added after the Phase-6 final bug check found the
      # invariant had drifted (utility modules exported helpers only the bench
      # harness / their own file consume) precisely because nothing enforced it.
      - name: Dead code & duplication (fallow)
        run: |
          pnpm fallow:dead
          pnpm fallow:dupes

      - name: Format
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # Phase 6 / Plan §4.8-C5: the K15 measurement base runs on every push.
      # It compiles the REAL src/utils modules with the repository's tsc and
      # measures them against verbatim copies of the pre-Phase-6 code, so the
      # gates are same-run ratios (C1 hoisting, C2 comparator choice, the Rust
      # tensor-tree decode) and hold on a shared runner. The absolute K15
      # numbers are recorded with the env block and judged on the reference
      # machine (Plan §2.2); the browser paint leg is instrumented in the app
      # itself (src/utils/perf.ts). The Rust<->JS tree cross-check needs a
      # built native binary and runs in native.yml's integration job instead.
      - name: Frontend K15 bench (C5)
        run: node scripts/bench/front/k15.mjs --json-out /tmp/phase6_front.json

      - name: Static types (mypy)
        run: python -m mypy

      - name: Python lint (ruff)
        run: ruff check py __init__.py tests scripts conftest.py

      - name: Python format (ruff)
        run: ruff format --check py __init__.py tests scripts conftest.py

      # Phase 0 regression suite: the Quick Win A1 route contract and the
      # py/native.py loader (MM_NATIVE switch, platform tags, handshake).
      # Loader tests that need a built mm_core binary skip here; the native
      # workflow covers those against real artifacts on every OS.
      - name: Python tests (pytest)
        run: python -m pytest tests -q
