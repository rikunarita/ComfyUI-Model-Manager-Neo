# Native core CI (Agent/Plan.md §5.3) — Phase 0 scope:
#
#   native-test    cargo fmt / clippy -D warnings / tests on the three OSes
#                  (Linux links with rustc's bundled rust-lld — the default
#                  since Rust 1.90; no apt toolchain is installed any more,
#                  NEO-PLAN-2026-002 Step 1)
#   native-build-* abi3 artifacts for every platform tag (5 rust targets:
#                  linux x86_64 + aarch64 via cargo-zigbuild glibc 2.28,
#                  windows x86_64 MSVC, macOS universal2 = both darwin archs),
#                  per-binary size-budget gate + import smoke on each OS
#   abi3-import    the linux artifact imported by CPython 3.10 AND 3.13
#                  (proves the abi3-py310 single-binary claim, Plan §3.2)
#   size-budget    <= 5 MB per binary (per arch slice; the macOS universal2 fat
#                  binary is detected by its FAT_MAGIC and gets a doubled 10 MB
#                  file budget) and <= 20 MB total across all artifacts
#                  (Plan §3.3 / R6)
#
# Permanent quality gates (Plan §5.3):
#   fuzz-smoke     L3 cargo-fuzz smoke (7 targets x 60 s, ASan)
#   integration    L4/L5 — the full pytest suite against the built artifact
#                  on all three OSes + the official pip-zipnn 0.5.4
#                  cross-validation on ubuntu (Phase 2)
# The transition-era L2 golden differential (native-diff, vs the bundled
# prebuilt C core) was retired in Phase 8 together with third_party/; the
# committed evidence stays under scripts/bench/results/ (l2_*.json).
# Artifacts are verification only on PR/dev runs; on `main` the
# publish-native-bin job commits the four platform binaries back into
# `native/native-bin/` (Plan §5.3 / Phase 8 distribution: a fresh clone must
# work with no compiler, no pip and no network - K16).
name: native

on:
  push:
    branches: [main, dev]
    # Release tags get the same verification (build + size + import + L4/L5);
    # the binaries a tag ships are the ones committed on main (publish job
    # below is main-only - a tag checkout is detached and never pushed to).
    tags: ["v*"]
  pull_request:

concurrency:
  # NOTE (2026-09-30 incident, run #78): `group: native-${{ github.ref }}` is
  # NOT collision-free. When a PR is merged seconds after opening, GitHub can
  # materialize the `pull_request` run LATE (PR #16: merged 15 s after open;
  # the run appeared 92 s after the merge) — and because the PR is already
  # closed, its context resolves to the BASE branch: github.ref came back as
  # refs/heads/main (checkout fetched the merge commit, `-B main`), so the
  # ghost entered native-refs/heads/main and cancelled the legitimate
  # main-push run ("Canceling since a higher priority waiting request for
  # native-refs/heads/main exists"). Keying pull_request runs by PR NUMBER
  # makes it structurally impossible for any PR-triggered run (ghost or not)
  # to share a group with a push run; per-PR supersede-cancel semantics are
  # unchanged (refs/pull/N/merge <-> PR number is 1:1).
  group: native-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native-test:
    # Ghost-run guard (see the concurrency note above): a real pull_request
    # run ALWAYS has github.ref = refs/pull/<n>/merge; when GitHub materializes
    # a pull_request run late (PR merged seconds after opening), the closed
    # PR's context resolves to a BRANCH ref instead — such a ghost must not
    # execute (it would test an unrelated base-branch state under a
    # PR-triggered run). Push runs are unaffected; downstream jobs
    # (abi3-import / size-budget / integration) skip via `needs`.
    if: github.event_name != 'pull_request' || startsWith(github.ref, 'refs/pull/')
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # pyo3's build script wants a Python interpreter present.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # No linker toolchain is installed here on purpose (NEO-PLAN-2026-002
      # Step 1): Linux builds link with rustc's bundled rust-lld, the default
      # for x86_64-unknown-linux-gnu since Rust 1.90. The former
      # `apt-get install clang mold` step is gone — it once hung for 6 h on a
      # stalled mirror and got the whole push run cancelled (2026-09-30,
      # run #80), and removing the external dependency removes that failure
      # surface entirely.

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test (pure-Rust crates)
        run: cargo test --workspace --exclude mm-core

      # Guard the feature toggle itself: `--no-default-features` must really
      # drop pyo3/extension-module (a workspace-level `features = [...]` on
      # the pyo3 dependency would silently pin it on and break the test link
      # the moment mm-core gains tests that touch #[pyfunction] items).
      # cargo tree -e features does not render crate-level feature edges
      # reliably, so the resolved feature set is read from cargo metadata.
      - name: Verify the extension-module toggle toggles
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          def pyo3_features(extra):
              out = subprocess.run(
                  ["cargo", "metadata", "--format-version", "1", *extra],
                  capture_output=True, text=True, check=True,
              ).stdout
              meta = json.loads(out)
              names = {p["id"]: p["name"] for p in meta["packages"]}
              for node in meta["resolve"]["nodes"]:
                  if names.get(node["id"]) == "pyo3":
                      return set(node["features"])
              sys.exit("BUG: pyo3 missing from the resolve graph")

          default = pyo3_features([])
          tests = pyo3_features(["--no-default-features"])
          if "extension-module" not in default:
              sys.exit("BUG: pyo3/extension-module missing from default features")
          if "extension-module" in tests:
              sys.exit("BUG: pyo3/extension-module leaks into --no-default-features")
          if not {"abi3-py310"} <= tests:
              sys.exit("BUG: abi3-py310 must stay enabled in every mode")
          print("extension-module toggle verified (on by default, off for tests, abi3 always on)")
          PY

      # mm-core's test harness must link libpython, so it is tested without
      # the extension-module feature (see native/README.md). macOS is
      # excluded: the python.org macOS builds behind setup-python ship no
      # linkable libpython (framework only), so a pyo3 test harness cannot
      # link there — mm-core is covered on macOS by clippy --all-targets
      # plus the abi3 build & import smoke job instead.
      - name: cargo test (mm-core, no extension-module)
        if: runner.os != 'macOS'
        run: cargo test -p mm-core --no-default-features

      - name: cargo test (release)
        run: cargo test --workspace --release --exclude mm-core

  native-build-linux:
    # Ghost-run guard — see native-test.
    if: github.event_name != 'pull_request' || startsWith(github.ref, 'refs/pull/')
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Plan Phase 7 T4: uv replaces pip in the CI layer (drop-in
      # `uv pip install --system` against the setup-python interpreter).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install cross toolchain (pinned, Plan §3.3)
        run: uv pip install --system cargo-zigbuild==0.23.4 ziglang==0.16.0 maturin==1.15.0

      - name: Build linux-x86_64 (glibc 2.28 floor)
        run: ./scripts/build-native.sh --target linux-x86_64 --size-gate

      - name: Build linux-aarch64 (glibc 2.28 floor)
        run: ./scripts/build-native.sh --target linux-aarch64 --size-gate

      - name: Verify the glibc floor (max referenced GLIBC <= 2.28)
        run: |
          for f in native/native-bin/linux-x86_64/mm_core.abi3.so native/native-bin/linux-aarch64/mm_core.abi3.so; do
            max=$(readelf -V "$f" | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | tail -1)
            echo "$f -> ${max:-none}"
            highest=$(printf '%s\nGLIBC_2.28\n' "${max:-GLIBC_2.0}" | sort -Vu | tail -1)
            if [ "$highest" != "GLIBC_2.28" ]; then
              echo "glibc floor violated by $f: $max"; exit 1
            fi
          done

      - name: Import smoke (linux-x86_64 artifact, CPython 3.11)
        run: |
          PYTHONPATH=native/native-bin/linux-x86_64 python -c "import mm_core; print('abi3 import OK:', mm_core.api_version(), mm_core.core_version())"

      # The verify job (ci.yml) runs the same suite WITHOUT a built artifact,
      # where the handshake test skips; here it runs against the real
      # zigbuild binary — the loader's auto path (platform tag -> native-bin
      # -> import -> api_version handshake) is covered end to end.
      - name: Loader regression tests against the built artifact
        run: |
          # markdownify + pillow are module-level imports of py/information.py, which
          # py/search.py (and therefore the Phase-6 A3 mock tests) pulls in.
          uv pip install --system pytest pytest-asyncio aiohttp pyyaml requests pillow markdownify
          python -m pytest tests -q

      - uses: actions/upload-artifact@v7
        with:
          name: native-bin-linux
          path: |
            native/native-bin/linux-x86_64/mm_core.abi3.so
            native/native-bin/linux-aarch64/mm_core.abi3.so

  native-build-macos:
    # Ghost-run guard — see native-test.
    if: github.event_name != 'pull_request' || startsWith(github.ref, 'refs/pull/')
    timeout-minutes: 60
    runs-on: macos-latest # arm64; universal2 covers x86_64 as well
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Plan Phase 7 T4: uv replaces pip in the CI layer.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install maturin (pinned, Plan §3.3)
        run: uv pip install --system maturin==1.15.0

      - name: Build macos-universal2 (maturin = both archs + lipo)
        run: ./scripts/build-native.sh --target macos-universal2 --size-gate

      - name: Verify universal2 fat binary
        run: lipo -info native/native-bin/macos-universal2/mm_core.abi3.so

      - name: Import smoke (CPython 3.11 arm64)
        run: |
          PYTHONPATH=native/native-bin/macos-universal2 python -c "import mm_core; print('abi3 import OK:', mm_core.api_version(), mm_core.core_version())"

      - uses: actions/upload-artifact@v7
        with:
          name: native-bin-macos
          path: native/native-bin/macos-universal2/mm_core.abi3.so

  native-build-windows:
    # Ghost-run guard — see native-test.
    if: github.event_name != 'pull_request' || startsWith(github.ref, 'refs/pull/')
    timeout-minutes: 60
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Plan Phase 7 T4: uv replaces pip in the CI layer.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install maturin (pinned, Plan §3.3)
        run: uv pip install --system maturin==1.15.0

      - name: Build windows-x86_64 (MSVC)
        run: ./scripts/build-native.sh --target windows-x86_64 --size-gate

      - name: Import smoke (CPython 3.11)
        run: |
          PYTHONPATH=native/native-bin/windows-x86_64 python -c "import mm_core; print('abi3 import OK:', mm_core.api_version(), mm_core.core_version())"

      - uses: actions/upload-artifact@v7
        with:
          name: native-bin-windows
          path: native/native-bin/windows-x86_64/mm_core.pyd

  abi3-import:
    timeout-minutes: 60
    # One binary, every CPython >= 3.10: prove it on the oldest and a current
    # interpreter (Plan §3.2 abi3-py310 claim).
    runs-on: ubuntu-latest
    needs: native-build-linux
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v8
        with:
          name: native-bin-linux
          path: native-bin

      - name: Import the abi3 artifact
        run: |
          PYTHONPATH=native-bin/linux-x86_64 python - <<'PY'
          import sys
          import mm_core

          assert mm_core.api_version() == 6, mm_core.api_version()
          # v6 = Phase 7 T7's preview WebP codec must be present in the abi3 binary.
          assert all(
              hasattr(mm_core, n)
              for n in ("webp_decode", "webp_decode_animation", "webp_encode", "webp_encode_animation")
          )
          print(f"abi3 import OK on CPython {sys.version.split()[0]}: {mm_core.core_version()}")
          PY

  size-budget:
    timeout-minutes: 60
    # Plan §3.3 / R6: <= 5 MB per binary, <= 20 MB for the whole native-bin.
    # The macOS universal2 artifact is a FAT binary (x86_64 + arm64 = two
    # architecture slices), so its per-file budget is doubled — each slice is
    # within the single-binary 5 MB budget (build-native.sh gates the thinned
    # slices on the macOS runner; lipo is unavailable on this ubuntu job). The
    # 20 MB TOTAL across all four artifacts is the real repo-bloat guard (R6).
    runs-on: ubuntu-latest
    needs: [native-build-linux, native-build-macos, native-build-windows]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: native-bin-*
          path: artifacts
          merge-multiple: true

      - name: Enforce the size budget
        run: |
          total=0
          found=0
          while IFS= read -r f; do
            size=$(stat -c %s "$f")
            # A macOS universal2 artifact is a FAT Mach-O holding TWO
            # architecture slices (x86_64 + arm64), so Plan §3.3's "<= 5 MB per
            # binary" applies per SLICE and the fat file gets a doubled budget.
            # Detect it by content (FAT_MAGIC 0xcafebabe / FAT_MAGIC_64
            # 0xcafebabf, big-endian on disk) rather than by path — the
            # downloaded artifact's directory layout is not guaranteed to carry
            # the `macos-universal2` segment. build-native.sh additionally gates
            # each thinned slice at the single-binary budget on the macOS runner.
            budget=5242880
            magic=$(od -An -tx1 -N4 "$f" | tr -d ' ')
            case "$magic" in
              cafebabe | cafebabf) budget=10485760 ;;
            esac
            echo "$f: $size bytes (magic $magic, budget $budget)"
            if [ "$size" -gt "$budget" ]; then echo "OVER BUDGET (> $budget): $f"; exit 1; fi
            total=$((total + size))
            found=$((found + 1))
          done < <(find artifacts -type f \( -name '*.so' -o -name '*.pyd' \) | sort)
          echo "binaries: $found, total: $total bytes"
          if [ "$found" -lt 4 ]; then echo "expected 4 platform binaries, found $found"; exit 1; fi
          if [ "$total" -gt 20971520 ]; then echo "TOTAL OVER BUDGET (>20 MB)"; exit 1; fi

  integration:
    timeout-minutes: 60
    # L4/L5 integration (Plan §5.3 "integration" job): the FULL pytest suite —
    # route/ws golden contracts, the L4 corpus round-trips, cancellation,
    # corruption retreat, cleanup — runs against the real built artifact on
    # every OS (Phase 8: the native core is the single engine, so every cell
    # runs the same suite). Ubuntu is the extended cell: pip torch enables the
    # reference-writer cross-check (phase4) and the L5 gate re-runs against
    # the UPSTREAM pip zipnn 0.5.4 (source-built on the runner) — the
    # mechanical proof that Neo's files are official-compatible (Plan §5.1 L5).
    needs: [native-build-linux, native-build-windows, native-build-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: native-bin-linux
            tag: linux-x86_64
          - os: windows-latest
            artifact: native-bin-windows
            tag: windows-x86_64
          - os: macos-latest
            artifact: native-bin-macos
            tag: macos-universal2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Plan Phase 7 T4: uv replaces pip in the CI layer. The torch CPU wheel
      # (~200 MB) install below is where uv's resolve+install speedup and the
      # download cache pay off the most.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Fetch the built native artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: native/native-bin/_staging

      # upload-artifact stores files relative to the least-common ancestor of
      # the uploaded paths: the linux artifact (two tag dirs) keeps its <tag>/
      # nesting, while the single-file windows/macos artifacts land BARE. The
      # loader only accepts native-bin/<tag>/mm_core.*, so normalize both
      # shapes here — the publish-native-bin job solves the same LCA problem
      # by classifying content instead. On main/PR runs the checkout may
      # ALREADY carry committed <tag>/ binaries (publish-native-bin), so merge
      # FILES into the tag dirs and let the fresh artifact win (this cell must
      # test what THIS run built, exactly like on dev): moving whole
      # directories fails against the non-empty committed ones (run #98:
      # "mv: cannot overwrite '../linux-aarch64': Directory not empty").
      - name: Stage the artifact under its platform tag
        shell: bash
        run: |
          set -euo pipefail
          cd native/native-bin
          shopt -s nullglob dotglob
          for entry in _staging/*; do
            if [ -d "$entry" ]; then
              tag="$(basename "$entry")"
              mkdir -p "$tag"
              find "$entry" -type f -exec mv -f {} "$tag"/ \;
            else
              mkdir -p "${{ matrix.tag }}"
              mv -f "$entry" "${{ matrix.tag }}/"
            fi
          done
          rm -rf _staging
          case "${{ matrix.tag }}" in
            windows-x86_64) need="mm_core.pyd" ;;
            *) need="mm_core.abi3.so" ;;
          esac
          [ -f "${{ matrix.tag }}/$need" ] || { echo "staging failed: ${{ matrix.tag }}/$need missing"; exit 1; }
          ls -l "${{ matrix.tag }}"

      # Loud guard: an integration cell must NEVER run without a loadable
      # core (that is how the skip-storm above stayed invisible). If the
      # staging above regresses, this fails the job instead of pytest
      # quietly skipping 132 tests.
      - name: Import smoke (the staged artifact must load in this cell)
        shell: bash
        run: |
          PYTHONPATH="native/native-bin/${{ matrix.tag }}" \
            python -c "import mm_core; print('integration import OK:', mm_core.api_version(), mm_core.core_version())"

      - name: Python test dependencies
        run: # markdownify + pillow are module-level imports of py/information.py, which
          # py/search.py (and therefore the Phase-6 A3 mock tests) pulls in.
          uv pip install --system pytest pytest-asyncio aiohttp pyyaml requests pillow markdownify

      # Ubuntu-only extras: torch + safetensors drive the REFERENCE-WRITER
      # cross-check (test_torch_saved_dtypes_roundtrip writes with the real
      # safetensors.torch and round-trips through the native core); blake3
      # enables the optional BLAKE3 leg of the identify hash-parity golden.
      # numpy is a RUNTIME requirement of that cross-check: safetensors.torch's
      # save path imports it while saving (native run #87 failed with
      # ModuleNotFoundError when Phase 8 prematurely dropped it - the test's
      # importorskip guards torch/safetensors.torch but the numpy import
      # happens deeper, at save_file time; the same class as the markdownify
      # incident, so this line must only ever change together with the suite).
      # The CPU wheel index keeps the install small (no CUDA payload).
      - name: Torch cross-check dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv pip install --system numpy safetensors blake3
          uv pip install --system torch --default-index https://download.pytorch.org/whl/cpu

      - name: Integration tests (pytest)
        run: python -m pytest tests -q

      # Phase 6 (Plan §4.7.3): the display tensor tree crosses a WIRE FORMAT
      # boundary - Rust folds it, TypeScript decodes it, and TypeScript can
      # also fold it itself as the fallback for a legacy backend. pytest pins
      # Rust == a Python reference; this pins the JS encoder == the Rust one
      # against the REAL built artifact, so a change to either side that breaks
      # the fallback fails here instead of in a user's Information tab.
      # typescript is installed outside the repository (the pnpm store is not
      # materialised in this job) and handed to the harness via MMNEO_TSC.
      - name: Tensor-tree wire cross-check (Rust == TypeScript)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p /tmp/mmneo-tsc && cd /tmp/mmneo-tsc
          npm init -y >/dev/null
          npm install --no-audit --no-fund --silent typescript@6.0.3 >/dev/null
          cd "$GITHUB_WORKSPACE"
          MMNEO_TSC=/tmp/mmneo-tsc/node_modules/typescript/bin/tsc \
            node scripts/bench/front/k15.mjs --cross-check \
            --models 1500 --keystrokes 40 --moe-layers 12 --moe-experts 8 \
            --json-out /tmp/phase6_front_crosscheck.json

      # L5 (Plan §5.1): Neo(Rust) compress → official decompress, official
      # compress → Neo decompress, and per-tensor blob parity — against the
      # pip-installed UPSTREAM zipnn 0.5.4 (source build on the runner).
      - name: L5 official-zipnn cross-validation (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv pip install --system zipnn==0.5.4
          python3 scripts/l5/official_cross.py

  fuzz-smoke:
    # L3 cargo-fuzz smoke (Plan §5.1 L3): 7 targets x 60 s with ASan on every
    # push/PR (Phase 2 adds st_parse + blob_decompress — the hostile
    # container / blob surface of the safetensors pipeline, §4.4.2; Phase 7 T7
    # adds webp_decode — the hostile-WebP preview decode surface). The
    # >=8 h budget runs in fuzz-long.yml (scheduled/dispatch), NOT on the
    # PR path (Plan: long runs are not PR gates).
    # Ghost-run guard — see native-test.
    if: github.event_name != 'pull_request' || startsWith(github.ref, 'refs/pull/')
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/crates/znn-codec/fuzz
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/crates/znn-codec/fuzz

      - name: Install mold + clang (sanitizer linking)
        # A hung `apt-get` (mirror stall) once burned the full 6 h job limit and
        # got the whole push run cancelled (2026-09-30, run #80, native-test
        # ubuntu: the step ran 14:36 -> 20:37 without output). A 10 min step
        # budget fails fast instead - the job goes red in minutes and a re-run
        # picks a healthy mirror (the same step took <20 s in runs #79/#81).
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold
          sudo ln -sf "$(command -v mold)" /usr/local/bin/ld.mold

      # Pinned cargo-fuzz 0.12.0 (0.13.x defaults to a musl target whose
      # libFuzzer build needs x86_64-linux-musl-g++, unavailable on runners;
      # gnu + ASan is the supported path). Official release binary.
      - name: Install cargo-fuzz 0.12.0 (pinned)
        run: |
          curl -sSfL https://github.com/rust-fuzz/cargo-fuzz/releases/download/0.12.0/cargo-fuzz-0.12.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xz -C /tmp
          sudo install -m 755 /tmp/cargo-fuzz "$HOME/.cargo/bin/cargo-fuzz"
          cargo fuzz --version

      - name: Build fuzz targets (dev + ASan, gnu target)
        run: cargo +nightly fuzz build -D --target x86_64-unknown-linux-gnu

      - name: Smoke-fuzz all seven targets (60 s each)
        run: |
          for t in huf_decompress zn_header codec_decompress st_parse blob_decompress delta_decompress webp_decode; do
            cargo +nightly fuzz run "$t" --target x86_64-unknown-linux-gnu --dev -- \
              -max_total_time=60 -rss_limit_mb=1024 -timeout=15
          done

      - name: Upload crash artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: native/crates/znn-codec/fuzz/artifacts/
          if-no-files-found: ignore

  publish-native-bin:
    # Phase 8 distribution (Plan §5.3 / K16): on `main` pushes, commit the
    # four freshly built platform binaries back into native/native-bin/ so a
    # fresh clone runs the ZipNN engine with NO compiler, NO pip and NO
    # network. dev/PR runs never publish (their artifacts are verification
    # only); release tags ship whatever main already carries. The push uses
    # the default GITHUB_TOKEN (contents: write) and GitHub does not trigger
    # new workflow runs for token-created commits, so this cannot loop.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [native-build-linux, native-build-macos, native-build-windows]
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: native-bin-*
          path: artifacts
          merge-multiple: true

      # download-artifact's layout is the uploads' least-common ancestor, so
      # the `<tag>` directory segment can vanish (the size-budget job's
      # FAT_MAGIC note). Identify each binary by CONTENT instead: ELF
      # e_machine (x86_64 / aarch64), Mach-O FAT magic, or the .pyd name.
      - name: Stage the four platform binaries into native/native-bin/
        run: |
          python3 - <<'PY'
          import pathlib, shutil, sys

          targets = {
              "linux-x86_64": "mm_core.abi3.so",
              "linux-aarch64": "mm_core.abi3.so",
              "macos-universal2": "mm_core.abi3.so",
              "windows-x86_64": "mm_core.pyd",
          }
          found = {}
          for path in sorted(pathlib.Path("artifacts").rglob("*")):
              if not path.is_file() or path.suffix not in (".so", ".pyd"):
                  continue
              head = path.read_bytes()[:4]
              if path.suffix == ".pyd":
                  tag = "windows-x86_64"
              elif head == b"\x7fELF":
                  machine = int.from_bytes(path.read_bytes()[18:20], "little")
                  tag = {0x3E: "linux-x86_64", 0xB7: "linux-aarch64"}.get(machine)
              elif head.hex() in ("cafebabe", "cafebabf"):
                  tag = "macos-universal2"
              else:
                  tag = None
              if tag is None:
                  sys.exit(f"cannot classify artifact {path} (magic {head!r})")
              if tag in found:
                  sys.exit(f"duplicate artifact for {tag}: {found[tag]} and {path}")
              found[tag] = path
          missing = sorted(set(targets) - set(found))
          if missing:
              sys.exit(f"missing platform binaries: {missing}")
          for tag, name in targets.items():
              out = pathlib.Path("native/native-bin") / tag
              out.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(found[tag], out / name)
              print(f"staged {found[tag]} -> {out / name} ({(out / name).stat().st_size} bytes)")
          PY

      - name: Verify all four platform binaries are staged in the worktree
        run: |
          set -euo pipefail
          for f in native/native-bin/linux-x86_64/mm_core.abi3.so \
                   native/native-bin/linux-aarch64/mm_core.abi3.so \
                   native/native-bin/macos-universal2/mm_core.abi3.so \
                   native/native-bin/windows-x86_64/mm_core.pyd; do
            test -s "$f" || { echo "BUG: $f is missing or empty"; exit 1; }
          done

      # The *.so ignore in .gitignore is deliberate for dev/PR worktrees (a
      # local debug build must never be committed by accident); THIS job is
      # the single authorised publisher and force-adds the release artifacts.
      - name: Commit & push (no-op when the binaries are unchanged)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f native/native-bin
          if git diff --cached --quiet; then
            echo "native-bin is byte-identical to HEAD - nothing to commit"
          else
            git commit -m "chore(native-bin): rebuild the prebuilt mm_core artifacts from ${GITHUB_SHA::7}

          Generated by the publish-native-bin job (Plan §5.3 / Phase 8):
          the four platform binaries (linux x86_64/aarch64 glibc>=2.28,
          macos universal2, windows x86_64) that a fresh clone imports
          directly - no compiler, no pip, no network (K16)."
            git push
          fi
