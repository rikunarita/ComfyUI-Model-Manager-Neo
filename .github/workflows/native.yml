# Native core CI (Agent/Plan.md §5.3) — Phase 0 scope:
#
#   native-test    cargo fmt / clippy -D warnings / tests on the three OSes
#                  (Linux links with rustc's bundled rust-lld — the default
#                  since Rust 1.90; no apt toolchain is installed any more,
#                  NEO-PLAN-2026-002 Step 1)
#   native-build-* the stable-ABI artifacts for every platform tag in BOTH
#                  flavours (NEO-PLAN-2026-003): abi3 (GIL builds, floor
#                  abi3-py312) and abi3t (<tag>t, PEP 803 — free-threaded
#                  CPython 3.15+, non-PGO per D2, host 3.15.0-rc.2 per D4),
#                  over the same 5 rust targets: linux x86_64 + aarch64 via
#                  cargo-zigbuild glibc 2.28, windows x86_64 MSVC, macOS
#                  universal2 = both darwin archs; per-binary size-budget
#                  gate + import smoke on each OS (the t smokes run on the
#                  3.15 GIL AND the free-threaded interpreter)
#   abi3-import    the linux artifacts imported across the support matrix:
#                  abi3 under CPython 3.12 AND 3.14 (the abi3-py312 single-
#                  binary claim, floor raised from 3.10 by NEO-PLAN-2026-003)
#                  + abi3t under BOTH 3.15 builds (GIL and free-threaded —
#                  the PEP 803 load table's two columns)
#   size-budget    <= 5 MB per binary (per arch slice; the macOS universal2
#                  fat binaries are detected by their FAT_MAGIC and get a
#                  doubled 10 MB file budget), all 8 artifacts present (the
#                  shape contract: 4 abi3 + 4 abi3t) and the 40 MB total
#                  GUIDELINE (Plan-3 D1: an overage warns in the job summary,
#                  it does not block the run)
#
# Permanent quality gates (Plan §5.3):
#   fuzz-smoke     L3 cargo-fuzz smoke (7 targets x 60 s, ASan)
#   integration    L4/L5 — the full pytest suite against the built artifact
#                  on all three OSes + the official pip-zipnn 0.5.4
#                  cross-validation on ubuntu (Phase 2) + the free-threaded
#                  ubuntu cell (3.15t against the abi3t artifact, Plan-3 D3)
# The transition-era L2 golden differential (native-diff, vs the bundled
# prebuilt C core) was retired in Phase 8 together with third_party/; the
# committed evidence stays under scripts/bench/results/ (l2_*.json).
# Artifacts are verification only on PR/dev runs; on `main` the
# publish-native-bin job commits the eight platform binaries (4 abi3 + 4
# abi3t) back into `native/native-bin/` (Plan §5.3 / Phase 8 distribution: a
# fresh clone must work with no compiler, no pip and no network - K16).
name: native

on:
  push:
    branches: [main, dev]
    # Release tags get the same verification (build + size + import + L4/L5);
    # the binaries a tag ships are the ones committed on main (publish job
    # below is main-only - a tag checkout is detached and never pushed to).
    tags: ["v*"]
  pull_request:
  # Manual dispatch (UI / API) — used for the pgo-measure pilot job below
  # (NEO-PLAN-2026-002 Step 3) and for on-demand re-verification.
  workflow_dispatch:

concurrency:
  # NOTE (2026-09-30 incident, run #78): `group: native-${{ github.ref }}` is
  # NOT collision-free. When a PR is merged seconds after opening, GitHub can
  # materialize the `pull_request` run LATE (PR #16: merged 15 s after open;
  # the run appeared 92 s after the merge) — and because the PR is already
  # closed, its context resolves to the BASE branch: github.ref came back as
  # refs/heads/main (checkout fetched the merge commit, `-B main`), so the
  # ghost entered native-refs/heads/main and cancelled the legitimate
  # main-push run ("Canceling since a higher priority waiting request for
  # native-refs/heads/main exists"). Keying pull_request runs by PR NUMBER
  # makes it structurally impossible for any PR-triggered run (ghost or not)
  # to share a group with a push run; per-PR supersede-cancel semantics are
  # unchanged (refs/pull/N/merge <-> PR number is 1:1).
  group: native-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native-test:
    # Ghost-run guard (see the concurrency note above): a real pull_request
    # run ALWAYS has github.ref = refs/pull/<n>/merge; when GitHub materializes
    # a pull_request run late (PR merged seconds after opening), the closed
    # PR's context resolves to a BRANCH ref instead — such a ghost must not
    # execute (it would test an unrelated base-branch state under a
    # PR-triggered run). Push runs are unaffected; downstream jobs
    # (abi3-import / size-budget / integration) skip via `needs`.
    if: github.event_name != 'pull_request' || startsWith(github.ref, 'refs/pull/')
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cache WRITE policy (NEO-PLAN-2026-003 cleanup) — authoritative comment,
      # the other rust-cache steps below just point here.
      #
      # Actions caches are scoped per ref and the repository cap is 10 GB, so
      # saving on every ref made ONE delivery cycle (dev push -> PR -> main
      # push) store the same keys three times, plus a fourth copy on every
      # release tag. A `pull_request` run's cache lands in the refs/pull/N/merge
      # scope, which GitHub documents as restorable ONLY by re-runs of that same
      # PR — after the merge it is dead weight until eviction. Measured
      # 2026-10-03: 9.65 GiB of 10 GiB used, 2.51 GiB of it from the
      # already-merged PR #29, and the weekly fuzz-long cache had already been
      # LRU-evicted to make room (its jobs then rebuild ASan nightly from
      # scratch). So: write only from the two long-lived branches, on the
      # trusted non-PR events (push / schedule / workflow_dispatch — the
      # `!= 'pull_request'` term also keeps the late-materialized ghost PR run
      # documented in the concurrency note above from writing into main's
      # scope).
      #
      # RESTORE IS UNAFFECTED: `save-if: false` only skips the post-step save
      # (rust-cache dist/save.js returns early), and the cache lookup falls back
      # to the default branch, so PR/tag/feature runs still start warm from
      # main's entries.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: >-
            ${{ github.event_name != 'pull_request' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      # pyo3's build script wants a Python interpreter present.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No linker toolchain is installed here on purpose (NEO-PLAN-2026-002
      # Step 1): Linux builds link with rustc's bundled rust-lld, the default
      # for x86_64-unknown-linux-gnu since Rust 1.90. The former
      # `apt-get install clang mold` step is gone — it once hung for 6 h on a
      # stalled mirror and got the whole push run cancelled (2026-09-30,
      # run #80), and removing the external dependency removes that failure
      # surface entirely.

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test (pure-Rust crates)
        run: cargo test --workspace --exclude mm-core

      # Guard the feature toggles themselves: `--no-default-features` must
      # really drop pyo3/extension-module (a workspace-level `features = [...]`
      # on the pyo3 dependency would silently pin it on and break the test link
      # the moment mm-core gains tests that touch #[pyfunction] items) AND, since
      # NEO-PLAN-2026-003 moved the abi3 floor out of the workspace pin into
      # mm-core's `stable-abi` feature, the test mode must also be
      # stable-ABI-free (version-specific libpython link) while the default
      # (shipping) mode carries exactly `abi3-py312`. The third axis is `ft`
      # (abi3t-py315, PEP 803): it must enable extension-module + abi3t-py315
      # and NEVER plain abi3 — enabling abi3 and abi3t together would make the
      # produced flavour host-dependent (Plan-3 §2-3/R6). cargo tree -e features
      # does not render crate-level feature edges reliably, so the resolved
      # feature set is read from cargo metadata.
      - name: Verify the pyo3 feature toggles (extension-module / stable-abi / ft)
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json, re, subprocess, sys

          def pyo3_features(extra):
              # No check=True: cargo's own stderr goes to the job log before
              # the exit — with capture_output+check a malformed invocation
              # shows up as a bare Python traceback and hides the real error.
              proc = subprocess.run(
                  ["cargo", "metadata", "--format-version", "1", *extra],
                  capture_output=True, text=True,
              )
              if proc.returncode != 0:
                  sys.stderr.write(proc.stderr)
                  sys.exit(f"BUG: cargo metadata {' '.join(extra) or '(no extra args)'} "
                           f"exited with {proc.returncode}")
              meta = json.loads(proc.stdout)
              names = {p["id"]: p["name"] for p in meta["packages"]}
              for node in meta["resolve"]["nodes"]:
                  if names.get(node["id"]) == "pyo3":
                      return set(node["features"])
              sys.exit("BUG: pyo3 missing from the resolve graph")

          def abi3_floors(features, prefix):
              # pyo3 0.29.2 (the locked version) chains the abi3[t]-pyXY
              # features UPWARD — enabling abi3-py312 transitively enables
              # abi3-py313/314/315 and bare abi3 (pyo3 + pyo3-ffi Cargo.toml) —
              # and pyo3-build-config get_abi3[t]_version() reads the floor as
              # the LOWEST activated pyXY. So "floor == py312" is "lowest
              # activated minor == 12", NOT "no higher abi3-py3XX present".
              return sorted(int(m[1]) for f in features
                            if (m := re.fullmatch(prefix + r"py3(\d+)", f)))

          default = pyo3_features([])
          tests = pyo3_features(["--no-default-features"])
          # cargo metadata has NO -p/--package selector (unlike build commands);
          # package/feature-qualified names scope the ft axis to mm-core — the
          # only workspace member that has these features and the only pyo3
          # dependent, so the resolve graph cannot unify anything else in.
          ft = pyo3_features(["--no-default-features",
                              "--features", "mm-core/extension-module,mm-core/ft"])
          # --- default (shipping GIL flavor): extension-module + abi3 floor EXACTLY py312, no abi3t
          if "extension-module" not in default:
              sys.exit("BUG: pyo3/extension-module missing from default features")
          floors = abi3_floors(default, "abi3-")
          if not floors or floors[0] != 12:
              sys.exit(f"BUG: default features must floor the abi3 at exactly py312 "
                       f"(mm-core/stable-abi; activated abi3-py3XX minors: {floors or 'none'})")
          if any(f.startswith("abi3t") for f in default):
              sys.exit("BUG: abi3t leaks into the default (GIL) feature set")
          # --- test mode: bare pyo3 (version-specific libpython link)
          if "extension-module" in tests:
              sys.exit("BUG: pyo3/extension-module leaks into --no-default-features")
          if any(f.startswith("abi3") for f in tests):
              sys.exit("BUG: --no-default-features must be stable-ABI-free (version-specific test link)")
          # --- ft mode (abi3t): extension-module + abi3t floor EXACTLY py315, and NEVER plain abi3
          if "extension-module" not in ft:
              sys.exit("BUG: pyo3/extension-module missing from the ft feature set")
          t_floors = abi3_floors(ft, "abi3t-")
          if not t_floors or t_floors[0] != 15:
              sys.exit(f"BUG: ft must floor the abi3t at exactly py315 "
                       f"(mm-core/ft; activated abi3t-py3XX minors: {t_floors or 'none'})")
          if "abi3" in ft or any(f.startswith("abi3-py3") for f in ft):
              sys.exit("BUG: abi3 and abi3t must never be enabled together (host-dependent flavor, Plan-3 R6)")
          print("pyo3 feature toggles verified (default = extension-module + abi3 floor py312; "
                "test mode = bare; ft = extension-module + abi3t floor py315, abi3-free)")
          PY

      # mm-core's test harness must link libpython, so it is tested without
      # the extension-module feature (see native/README.md). macOS is
      # excluded: the python.org macOS builds behind setup-python ship no
      # linkable libpython (framework only), so a pyo3 test harness cannot
      # link there — mm-core is covered on macOS by clippy --all-targets
      # plus the abi3 build & import smoke job instead.
      - name: cargo test (mm-core, no extension-module)
        if: runner.os != 'macOS'
        run: cargo test -p mm-core --no-default-features

      - name: cargo test (release)
        run: cargo test --workspace --release --exclude mm-core

  native-build-linux:
    # Ghost-run guard — see native-test.
    if: github.event_name != 'pull_request' || startsWith(github.ref, 'refs/pull/')
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
          # llvm-profdata for the PGO merge below (NEO-PLAN-2026-002 Step 4).
          components: llvm-tools-preview

      # Cache write policy — see native-test.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: >-
            ${{ github.event_name != 'pull_request' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Plan Phase 7 T4: uv replaces pip in the CI layer (drop-in
      # `uv pip install --system` against the setup-python interpreter).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install cross toolchain (pinned, Plan §3.3)
        run: |
          set -euo pipefail
          uv pip install --system cargo-zigbuild==0.23.4 ziglang==0.16.0 maturin==1.15.0
          # Pin zig for cargo-zigbuild NOW, while this step's python3 (3.12)
          # still owns the ziglang package. cargo-zigbuild's lookup order is
          # CARGO_ZIGBUILD_ZIG_COMMAND -> `python3 -m ziglang` -> `zig` on PATH
          # (0.23.4 src/zig/locate.rs), and the py315 setup-python step below
          # re-points python3 at an interpreter WITHOUT ziglang; the ziglang
          # wheel also installs no `zig` shim on PATH (its only console script
          # is `python-zig`), so without this pin every <tag>t zigbuild fails
          # with "Failed to find zig". The resolved binary is exactly what
          # `python3 -m ziglang` execs (ziglang/__main__.py), and the generated
          # linker wrappers re-export CARGO_ZIGBUILD_ZIG_COMMAND themselves
          # (0.23.4 src/zig/wrapper.rs), so one job-wide env var covers both
          # the wrapper generation and every later compiler invocation.
          ZIG_BIN="$(python3 -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          [[ -x "$ZIG_BIN" ]] || { echo "ziglang binary missing or not executable: $ZIG_BIN" >&2; exit 1; }
          "$ZIG_BIN" version
          echo "CARGO_ZIGBUILD_ZIG_COMMAND=$ZIG_BIN" >> "$GITHUB_ENV"

      # NEO-PLAN-2026-002 Step 4: the linux-x86_64 artifact is PGO-optimized.
      # Three phases in one job (profile generated per build, never committed —
      # Plan-2 §4.6): instrumented HOST build (training must run on this
      # runner's arch) -> deterministic workload -> llvm-profdata merge. The
      # commit stamp matches build-native.sh so the version constant is
      # identical between the instrumented and the shipping build.
      - name: PGO training (instrumented host build -> workload -> merged profile)
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pgo-prof" && mkdir -p "$RUNNER_TEMP/pgo-prof" "$RUNNER_TEMP/pgo-inst"
          cd native
          MM_CORE_COMMIT="$(git rev-parse --short=9 HEAD 2>/dev/null || echo dev)" \
          RUSTFLAGS="-Cprofile-generate=$RUNNER_TEMP/pgo-prof" \
            cargo build --release -p mm-core --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/libmm_core.so "$RUNNER_TEMP/pgo-inst/mm_core.abi3.so"
          cd ..
          LLVM_PROFILE_FILE="$RUNNER_TEMP/pgo-prof/default_%m.profraw" \
            python scripts/pgo/train.py --lib-dir "$RUNNER_TEMP/pgo-inst" --workdir "$RUNNER_TEMP/pgo-work"
          LLVM_BIN="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin"
          "$LLVM_BIN/llvm-profdata" merge -o "$RUNNER_TEMP/pgo-prof/merged.profdata" "$RUNNER_TEMP/pgo-prof"
          "$LLVM_BIN/llvm-profdata" show "$RUNNER_TEMP/pgo-prof/merged.profdata" | tee "$RUNNER_TEMP/pgo-prof/show.txt"
          "$LLVM_BIN/llvm-profdata" show --all-functions "$RUNNER_TEMP/pgo-prof/merged.profdata" > "$RUNNER_TEMP/pgo-prof/allfuncs.txt"

      - name: Build linux-x86_64 (glibc 2.28 floor, PGO)
        shell: bash
        run: ./scripts/build-native.sh --target linux-x86_64 --size-gate --pgo "$RUNNER_TEMP/pgo-prof/merged.profdata" 2>&1 | tee "$RUNNER_TEMP/pgo-build.log"

      # Permanent G2 (Plan-2 §6.2 Step 4): a stale/mismatched profile degrades
      # to a silent no-op with no other symptom — detect it on every build.
      - name: G2 gate (the PGO profile applied to the shipping artifact)
        run: |
          set -euo pipefail
          python scripts/pgo/g2_check.py \
            "$RUNNER_TEMP/pgo-prof/show.txt" \
            "$RUNNER_TEMP/pgo-build.log" \
            --all-functions-txt "$RUNNER_TEMP/pgo-prof/allfuncs.txt"

      # linux-aarch64 stays NON-PGO on purpose: the profile above was
      # collected on x86_64 and cross-arch reuse is forbidden (Plan-2 §4.5 —
      # a silent partial match would be worse than no profile at all).
      # Revisit when an ARM hosted runner is warranted.
      - name: Build linux-aarch64 (glibc 2.28 floor)
        run: ./scripts/build-native.sh --target linux-aarch64 --size-gate

      - name: Verify the glibc floor (max referenced GLIBC <= 2.28)
        run: |
          for f in native/native-bin/linux-x86_64/mm_core.abi3.so native/native-bin/linux-aarch64/mm_core.abi3.so; do
            max=$(readelf -V "$f" | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | tail -1)
            echo "$f -> ${max:-none}"
            highest=$(printf '%s\nGLIBC_2.28\n' "${max:-GLIBC_2.0}" | sort -Vu | tail -1)
            if [ "$highest" != "GLIBC_2.28" ]; then
              echo "glibc floor violated by $f: $max"; exit 1
            fi
          done

      - name: Import smoke (linux-x86_64 artifact, CPython 3.12)
        run: |
          PYTHONPATH=native/native-bin/linux-x86_64 python -c "import mm_core; print('abi3 import OK:', mm_core.api_version(), mm_core.core_version())"

      # The verify job (ci.yml) runs the same suite WITHOUT a built artifact,
      # where the handshake test skips; here it runs against the real
      # zigbuild binary — the loader's auto path (platform tag -> native-bin
      # -> import -> api_version handshake) is covered end to end.
      - name: Loader regression tests against the built artifact
        run: |
          # markdownify + pillow are module-level imports of py/information.py, which
          # py/search.py (and therefore the Phase-6 A3 mock tests) pulls in.
          uv pip install --system pytest pytest-asyncio aiohttp pyyaml requests pillow markdownify
          python -m pytest tests -q

      # NEO-PLAN-2026-003 Step 2: the abi3t (PEP 803) artifacts for
      # free-threaded CPython 3.15+ — NON-PGO (D2: the LLVM profile runtime is
      # unvalidated on free-threaded hosts; the GIL-side PGO above is untouched)
      # and built with the EXCLUSIVE feature set (--no-default-features
      # --features extension-module,ft — never abi3+abi3t together, Plan-3
      # §2-3/R6). Host = 3.15.0-rc.2 GIL (PyO3 requires host >= target; D4
      # pins the rc until the 3.15 final lands in the runner manifest — the
      # ABI froze at rc1, so the final is a label-only swap).
      - uses: actions/setup-python@v7
        id: py315
        with:
          python-version: "3.15.0-rc.2"

      - name: Build linux-x86_64t (glibc 2.28 floor, abi3t, non-PGO)
        run: ./scripts/build-native.sh --target linux-x86_64t --size-gate

      # linux-aarch64t stays NON-PGO like its GIL sibling (cross-arch profile
      # reuse is forbidden, Plan-2 §4.5) — and like all <tag>t targets (D2).
      - name: Build linux-aarch64t (glibc 2.28 floor, abi3t, non-PGO)
        run: ./scripts/build-native.sh --target linux-aarch64t --size-gate

      - name: Verify the glibc floor (abi3t artifacts, max referenced GLIBC <= 2.28)
        run: |
          for f in native/native-bin/linux-x86_64t/mm_core.abi3t.so native/native-bin/linux-aarch64t/mm_core.abi3t.so; do
            max=$(readelf -V "$f" | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | tail -1)
            echo "$f -> ${max:-none}"
            highest=$(printf '%s\nGLIBC_2.28\n' "${max:-GLIBC_2.0}" | sort -Vu | tail -1)
            if [ "$highest" != "GLIBC_2.28" ]; then
              echo "glibc floor violated by $f: $max"; exit 1
            fi
          done

      - uses: actions/setup-python@v7
        id: py315t
        with:
          python-version: "3.15.0-rc.2"
          freethreaded: true

      # PEP 803: an abi3t artifact loads on BOTH 3.15+ builds — smoke both
      # flavours (the ft leg also asserts the GIL is really disabled, so a
      # mis-installed GIL interpreter cannot pass as the free-threaded one).
      - name: Import smoke (linux-x86_64t artifact, CPython 3.15 GIL + free-threaded)
        run: |
          PYTHONPATH=native/native-bin/linux-x86_64t "${{ steps.py315.outputs.python-path }}" -c "import mm_core; print('abi3t import OK (GIL 3.15):', mm_core.api_version(), mm_core.core_version())"
          PYTHONPATH=native/native-bin/linux-x86_64t "${{ steps.py315t.outputs.python-path }}" -c "import sys, mm_core; assert not sys._is_gil_enabled(); print('abi3t import OK (3.15t):', mm_core.api_version(), mm_core.core_version())"

      - uses: actions/upload-artifact@v7
        with:
          name: native-bin-linux
          # Verification-only: on `main` the publish job commits these eight
          # binaries into native/native-bin/, and the downstream jobs of THIS
          # run consume them within minutes. The 90-day default had accumulated
          # 396 live artifacts / 0.80 GiB (measured 2026-10-03, ~120 MiB/day).
          retention-days: 7
          path: |
            native/native-bin/linux-x86_64/mm_core.abi3.so
            native/native-bin/linux-aarch64/mm_core.abi3.so
            native/native-bin/linux-x86_64t/mm_core.abi3t.so
            native/native-bin/linux-aarch64t/mm_core.abi3t.so

  native-build-macos:
    # Ghost-run guard — see native-test.
    if: github.event_name != 'pull_request' || startsWith(github.ref, 'refs/pull/')
    timeout-minutes: 60
    runs-on: macos-latest # arm64; universal2 covers x86_64 as well
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          # llvm-tools-preview removed with the macOS non-PGO decision
          # (run #107 evidence — see the build step comment below).

      # Cache write policy — see native-test.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: >-
            ${{ github.event_name != 'pull_request' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Plan Phase 7 T4: uv replaces pip in the CI layer.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install maturin (pinned, Plan §3.3)
        run: uv pip install --system maturin==1.15.0

      # macOS ships NON-PGO — Plan-2 §4.4 decision (c), executed on the
      # run #107 evidence: maturin --pgo built the instrumented universal2
      # wheel and train.py completed the FULL workload successfully
      # ("[train] done in 5.612 s", all 30 sections, arm64 slice under
      # Python 3.11.9), but the process then died with SIGSEGV during
      # interpreter teardown — i.e. in the LLVM profile runtime's
      # exit-time flush of the instrumented FAT dylib. The optimized
      # rebuild was never reached; no profraw could be merged. Windows
      # (single-arch PE) and Linux (single-arch ELF, own three-phase flow)
      # both PGO fine, so this is specific to the instrumented universal2
      # image and is not debuggable without a macOS host (no guessing —
      # documented in Plan-2 v1.3 / MEMO session 23). Revisit option:
      # single-arch arm64-only PGO if the fat-binary exit crash is ever
      # fixed upstream. The per-slice size gate and the import smoke below
      # are unchanged.
      - name: Build macos-universal2 (maturin = both archs + lipo)
        run: ./scripts/build-native.sh --target macos-universal2 --size-gate

      - name: Verify universal2 fat binary
        run: lipo -info native/native-bin/macos-universal2/mm_core.abi3.so

      - name: Import smoke (CPython 3.12 arm64)
        run: |
          PYTHONPATH=native/native-bin/macos-universal2 python -c "import mm_core; print('abi3 import OK:', mm_core.api_version(), mm_core.core_version())"

      # NEO-PLAN-2026-003 Step 2: abi3t universal2 (non-PGO like the macOS GIL
      # side — Plan-2 §4.4; D2). Host 3.15.0-rc.2 (D4). The wheel naming check
      # of Plan-3 R4 is done by build-native.sh's cp315*abi3t* glob + the
      # .abi3t.so extraction (both fail loudly on a mismatch).
      - uses: actions/setup-python@v7
        id: py315
        with:
          python-version: "3.15.0-rc.2"

      - name: Build macos-universal2t (maturin, abi3t, both archs + lipo)
        run: ./scripts/build-native.sh --target macos-universal2t --size-gate

      - name: Verify universal2t fat binary
        run: lipo -info native/native-bin/macos-universal2t/mm_core.abi3t.so

      - uses: actions/setup-python@v7
        id: py315t
        with:
          python-version: "3.15.0-rc.2"
          freethreaded: true

      - name: Import smoke (macos-universal2t artifact, CPython 3.15 GIL + free-threaded arm64)
        run: |
          PYTHONPATH=native/native-bin/macos-universal2t "${{ steps.py315.outputs.python-path }}" -c "import mm_core; print('abi3t import OK (GIL 3.15 arm64):', mm_core.api_version(), mm_core.core_version())"
          PYTHONPATH=native/native-bin/macos-universal2t "${{ steps.py315t.outputs.python-path }}" -c "import sys, mm_core; assert not sys._is_gil_enabled(); print('abi3t import OK (3.15t arm64):', mm_core.api_version(), mm_core.core_version())"

      # Two tag directories (not a bare file) so the download-artifact LCA
      # keeps the tag segments — the windows/macos shapes must stay
      # distinguishable for the size-budget and publish staging (Plan-3 §3.4).
      - uses: actions/upload-artifact@v7
        with:
          name: native-bin-macos
          # Verification-only, 7 days — see the native-bin-linux upload.
          retention-days: 7
          path: |
            native/native-bin/macos-universal2/mm_core.abi3.so
            native/native-bin/macos-universal2t/mm_core.abi3t.so

  native-build-windows:
    # Ghost-run guard — see native-test.
    if: github.event_name != 'pull_request' || startsWith(github.ref, 'refs/pull/')
    timeout-minutes: 60
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-profdata for maturin --pgo (resolved from the rustc sysroot).
          components: llvm-tools-preview

      # Cache write policy — see native-test.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: >-
            ${{ github.event_name != 'pull_request' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Plan Phase 7 T4: uv replaces pip in the CI layer.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install maturin (pinned, Plan §3.3)
        run: uv pip install --system maturin==1.15.0

      # NEO-PLAN-2026-002 Step 4: maturin --pgo (three-phase flow; the
      # pgo-command runs through `cmd /C` in a temporary venv with the
      # instrumented wheel installed — train.py is stdlib-only by design).
      - name: Build windows-x86_64 (MSVC, PGO)
        run: ./scripts/build-native.sh --target windows-x86_64 --size-gate --pgo-train

      - name: Import smoke (CPython 3.12)
        run: |
          PYTHONPATH=native/native-bin/windows-x86_64 python -c "import mm_core; print('abi3 import OK:', mm_core.api_version(), mm_core.core_version())"

      # NEO-PLAN-2026-003 Step 2: abi3t (non-PGO — D2; the GIL side keeps
      # maturin --pgo above). Host 3.15.0-rc.2 (D4). PEP 803 keeps the plain
      # .pyd name on Windows, so the t artifact is separated ONLY by its
      # windows-x86_64t directory (Plan-3 R7: the upload below carries the
      # directory structure and the publish staging is directory-tag-first).
      - uses: actions/setup-python@v7
        id: py315
        with:
          python-version: "3.15.0-rc.2"

      - name: Build windows-x86_64t (MSVC, abi3t, non-PGO)
        run: ./scripts/build-native.sh --target windows-x86_64t --size-gate

      - uses: actions/setup-python@v7
        id: py315t
        with:
          python-version: "3.15.0-rc.2"
          freethreaded: true

      - name: Import smoke (windows-x86_64t artifact, CPython 3.15 GIL + free-threaded)
        run: |
          PYTHONPATH=native/native-bin/windows-x86_64t "${{ steps.py315.outputs.python-path }}" -c "import mm_core; print('abi3t import OK (GIL 3.15):', mm_core.api_version(), mm_core.core_version())"
          PYTHONPATH=native/native-bin/windows-x86_64t "${{ steps.py315t.outputs.python-path }}" -c "import sys, mm_core; assert not sys._is_gil_enabled(); print('abi3t import OK (3.15t):', mm_core.api_version(), mm_core.core_version())"

      - uses: actions/upload-artifact@v7
        with:
          name: native-bin-windows
          # Verification-only, 7 days — see the native-bin-linux upload.
          retention-days: 7
          path: |
            native/native-bin/windows-x86_64/mm_core.pyd
            native/native-bin/windows-x86_64t/mm_core.pyd

  abi3-import:
    timeout-minutes: 60
    # One binary per flavour, every CPython at/above its floor — both single-
    # binary claims proven on the runner matrix (NEO-PLAN-2026-003):
    #   abi3  (linux-x86_64, floor abi3-py312): 3.12 (the floor) + 3.14 (the
    #         newest stable on the runner manifest) — this job's classic
    #         "oldest + current" design, moved up from 3.10/3.13.
    #   abi3t (linux-x86_64t, floor 3.15, PEP 803): BOTH 3.15 builds — the GIL
    #         and the free-threaded one — because the howto's load table has
    #         exactly these two columns (a free-threaded build cannot load
    #         plain abi3; both builds load abi3t). D4: pinned to 3.15.0-rc.2
    #         until the final lands in the runner manifest (the ABI froze at
    #         rc1, so the swap is label-only).
    runs-on: ubuntu-latest
    needs: native-build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            freethreaded: false
            tag: linux-x86_64
          - python-version: "3.14"
            freethreaded: false
            tag: linux-x86_64
          - python-version: "3.15.0-rc.2"
            freethreaded: false
            tag: linux-x86_64t
          - python-version: "3.15.0-rc.2"
            freethreaded: true
            tag: linux-x86_64t
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          freethreaded: ${{ matrix.freethreaded }}

      - uses: actions/download-artifact@v8
        with:
          name: native-bin-linux
          path: native-bin

      - name: Import the stable-ABI artifact for this flavour
        run: |
          PYTHONPATH=native-bin/${{ matrix.tag }} python - <<'PY'
          import sys
          import mm_core

          assert mm_core.api_version() == 6, mm_core.api_version()
          # v6 = Phase 7 T7's preview WebP codec must be present in the binary.
          assert all(
              hasattr(mm_core, n)
              for n in ("webp_decode", "webp_decode_animation", "webp_encode", "webp_encode_animation")
          )
          gil = sys._is_gil_enabled() if hasattr(sys, "_is_gil_enabled") else True
          print(f"import OK on CPython {sys.version.split()[0]} (gil_enabled={gil}): {mm_core.core_version()}")
          PY

  size-budget:
    timeout-minutes: 60
    # HARD gates (Plan §3.3 / R6): <= 5 MB per binary, and `found = 8` — the
    # shape contract of the distribution (4 abi3 + 4 abi3t, NEO-PLAN-2026-003),
    # not a size statement. The macOS universal2 artifacts (abi3 AND abi3t) are
    # FAT binaries holding TWO architecture slices (x86_64 + arm64), so the
    # per-file budget is doubled for them — each slice is within the single-
    # binary 5 MB budget (build-native.sh gates the thinned slices on the macOS
    # runner; lipo is unavailable on this ubuntu job). The FAT files are
    # detected by content (FAT_MAGIC 0xcafebabe / FAT_MAGIC_64 0xcafebabf,
    # big-endian on disk) rather than by path — the downloaded artifact's
    # directory layout is not guaranteed to carry the `macos-universal2`
    # segment.
    # The TOTAL is the 40 MB GUIDELINE of Plan-3 D1 (user decision 2026-10-03:
    # advisory, not absolute): an overage emits a ::warning:: annotation plus a
    # job-summary line with the measured total and the overage — the run stays
    # green. The measured total is recorded in the job summary on EVERY run
    # (MEMO tracks the trend, R5). The old 20 MB hard total is physically
    # unreachable with 8 binaries (the 4 abi3 ones alone measured 18.1 MB).
    runs-on: ubuntu-latest
    needs: [native-build-linux, native-build-macos, native-build-windows]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: native-bin-*
          path: artifacts
          merge-multiple: true

      - name: Enforce the size budget
        run: |
          total=0
          found=0
          while IFS= read -r f; do
            size=$(stat -c %s "$f")
            budget=5242880
            magic=$(od -An -tx1 -N4 "$f" | tr -d ' ')
            case "$magic" in
              cafebabe | cafebabf) budget=10485760 ;;
            esac
            echo "$f: $size bytes (magic $magic, budget $budget)"
            if [ "$size" -gt "$budget" ]; then echo "OVER BUDGET (> $budget): $f"; exit 1; fi
            total=$((total + size))
            found=$((found + 1))
          done < <(find artifacts -type f \( -name '*.so' -o -name '*.pyd' \) | sort)
          echo "binaries: $found, total: $total bytes"
          if [ "$found" -lt 8 ]; then echo "expected 8 platform binaries (4 abi3 + 4 abi3t), found $found"; exit 1; fi
          {
            echo "## native-bin size report"
            echo ""
            echo "binaries: **$found** (shape contract: 8) — total: **$total bytes** (guideline: <= 40 MB, Plan-3 D1)"
          } >> "$GITHUB_STEP_SUMMARY"
          guideline=41943040
          if [ "$total" -gt "$guideline" ]; then
            over=$(( (total - guideline) * 100 / guideline ))
            echo "::warning::native-bin total ${total} B exceeds the 40 MB guideline by ${over}% (Plan-3 D1 — advisory, non-blocking)"
            echo "**OVER GUIDELINE** (> 40 MB by ${over}%) — advisory only (D1); the per-binary budgets above are the hard gates." >> "$GITHUB_STEP_SUMMARY"
          fi

  integration:
    timeout-minutes: 60
    # L4/L5 integration (Plan §5.3 "integration" job): the FULL pytest suite —
    # route/ws golden contracts, the L4 corpus round-trips, cancellation,
    # corruption retreat, cleanup — runs against the real built artifact on
    # every OS (Phase 8: the native core is the single engine, so every cell
    # runs the same suite). Ubuntu is the extended cell: pip torch enables the
    # reference-writer cross-check (phase4) and the L5 gate re-runs against
    # the UPSTREAM pip zipnn 0.5.4 (source-built on the runner) — the
    # mechanical proof that Neo's files are official-compatible (Plan §5.1 L5).
    # NEO-PLAN-2026-003 D3 adds the free-threaded ubuntu cell (3.15t against
    # the abi3t artifact): the FULL suite as the no-GIL soak, while the torch/
    # tsc/L5 legs stay in the GIL ubuntu cell (no cp315t wheels — the
    # conditions below key on the cell's tag, not its OS).
    needs: [native-build-linux, native-build-windows, native-build-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: native-bin-linux
            tag: linux-x86_64
            python-version: "3.12"
          - os: windows-latest
            artifact: native-bin-windows
            tag: windows-x86_64
            python-version: "3.12"
          - os: macos-latest
            artifact: native-bin-macos
            tag: macos-universal2
            python-version: "3.12"
          # NEO-PLAN-2026-003 D3 — the free-threaded soak cell: the FULL pytest
          # suite under 3.15t against the abi3t artifact. The native pipeline
          # tests load native-bin/linux-x86_64t through the REAL loader (the
          # loader's flavour detection routes 3.15t to the <tag>t directory),
          # so this cell is the mechanical proof of mm_core's no-GIL
          # concurrency posture (Plan-3 R3). ubuntu-only in v1: the torch/L5/
          # tsc legs have no 3.15t wheels (guarded off below), and the mac/win
          # t LOADING surface is covered by the build jobs' dual-flavour import
          # smokes + the abi3t cells of abi3-import. D4: rc.2 pin until the
          # 3.15 final lands in the runner manifest.
          - os: ubuntu-latest
            artifact: native-bin-linux
            tag: linux-x86_64t
            python-version: "3.15.0-rc.2"
            freethreaded: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          freethreaded: ${{ matrix.freethreaded || false }}

      # Plan Phase 7 T4: uv replaces pip in the CI layer. The torch CPU wheel
      # (~200 MB) install below is where uv's resolve+install speedup and the
      # download cache pay off the most.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Fetch the built native artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: native/native-bin/_staging

      # upload-artifact stores files relative to the least-common ancestor of
      # the uploaded paths: the linux artifact (two tag dirs) keeps its <tag>/
      # nesting, while the single-file windows/macos artifacts land BARE. The
      # loader only accepts native-bin/<tag>/mm_core.*, so normalize both
      # shapes here — the publish-native-bin job solves the same LCA problem
      # by classifying content instead. On main/PR runs the checkout may
      # ALREADY carry committed <tag>/ binaries (publish-native-bin), so merge
      # FILES into the tag dirs and let the fresh artifact win (this cell must
      # test what THIS run built, exactly like on dev): moving whole
      # directories fails against the non-empty committed ones (run #98:
      # "mv: cannot overwrite '../linux-aarch64': Directory not empty").
      - name: Stage the artifact under its platform tag
        shell: bash
        run: |
          set -euo pipefail
          cd native/native-bin
          shopt -s nullglob dotglob
          for entry in _staging/*; do
            if [ -d "$entry" ]; then
              tag="$(basename "$entry")"
              mkdir -p "$tag"
              find "$entry" -type f -exec mv -f {} "$tag"/ \;
            else
              mkdir -p "${{ matrix.tag }}"
              mv -f "$entry" "${{ matrix.tag }}/"
            fi
          done
          rm -rf _staging
          case "${{ matrix.tag }}" in
            windows-x86_64 | windows-x86_64t) need="mm_core.pyd" ;;
            *t) need="mm_core.abi3t.so" ;;
            *) need="mm_core.abi3.so" ;;
          esac
          [ -f "${{ matrix.tag }}/$need" ] || { echo "staging failed: ${{ matrix.tag }}/$need missing"; exit 1; }
          ls -l "${{ matrix.tag }}"

      # Loud guard: an integration cell must NEVER run without a loadable
      # core (that is how the skip-storm above stayed invisible). If the
      # staging above regresses, this fails the job instead of pytest
      # quietly skipping 132 tests.
      - name: Import smoke (the staged artifact must load in this cell)
        shell: bash
        run: |
          PYTHONPATH="native/native-bin/${{ matrix.tag }}" \
            python -c "import mm_core; print('integration import OK:', mm_core.api_version(), mm_core.core_version())"

      - name: Python test dependencies
        run: # markdownify + pillow are module-level imports of py/information.py, which
          # py/search.py (and therefore the Phase-6 A3 mock tests) pulls in.
          # On the 3.15t cell, pillow DOES ship cp315t wheels while aiohttp and
          # pyyaml do not (PyPI surveyed 2026-10-03, NEO-PLAN-2026-003) — they
          # build from sdist on the runner (gcc); their C dependencies
          # (multidict/yarl/propcache) have cp315t wheels, frozenlist/aiosignal
          # ship pure-python fallbacks.
          uv pip install --system pytest pytest-asyncio aiohttp pyyaml requests pillow markdownify

      # Ubuntu-only extras: torch + safetensors drive the REFERENCE-WRITER
      # cross-check (test_torch_saved_dtypes_roundtrip writes with the real
      # safetensors.torch and round-trips through the native core); blake3
      # enables the optional BLAKE3 leg of the identify hash-parity golden.
      # numpy is a RUNTIME requirement of that cross-check: safetensors.torch's
      # save path imports it while saving (native run #87 failed with
      # ModuleNotFoundError when Phase 8 prematurely dropped it - the test's
      # importorskip guards torch/safetensors.torch but the numpy import
      # happens deeper, at save_file time; the same class as the markdownify
      # incident, so this line must only ever change together with the suite).
      # The CPU wheel index keeps the install small (no CUDA payload).
      - name: Torch cross-check dependencies (ubuntu GIL cell only)
        if: matrix.tag == 'linux-x86_64'
        run: |
          uv pip install --system numpy safetensors blake3
          uv pip install --system torch --default-index https://download.pytorch.org/whl/cpu

      - name: Integration tests (pytest)
        run: python -m pytest tests -q

      # Phase 6 (Plan §4.7.3): the display tensor tree crosses a WIRE FORMAT
      # boundary - Rust folds it, TypeScript decodes it, and TypeScript can
      # also fold it itself as the fallback for a legacy backend. pytest pins
      # Rust == a Python reference; this pins the JS encoder == the Rust one
      # against the REAL built artifact, so a change to either side that breaks
      # the fallback fails here instead of in a user's Information tab.
      # typescript is installed outside the repository (the pnpm store is not
      # materialised in this job) and handed to the harness via MMNEO_TSC.
      - name: Tensor-tree wire cross-check (Rust == TypeScript)
        if: matrix.tag == 'linux-x86_64'
        run: |
          mkdir -p /tmp/mmneo-tsc && cd /tmp/mmneo-tsc
          npm init -y >/dev/null
          npm install --no-audit --no-fund --silent typescript@6.0.3 >/dev/null
          cd "$GITHUB_WORKSPACE"
          MMNEO_TSC=/tmp/mmneo-tsc/node_modules/typescript/bin/tsc \
            node scripts/bench/front/k15.mjs --cross-check \
            --models 1500 --keystrokes 40 --moe-layers 12 --moe-experts 8 \
            --json-out /tmp/phase6_front_crosscheck.json

      # L5 (Plan §5.1): Neo(Rust) compress → official decompress, official
      # compress → Neo decompress, and per-tensor blob parity — against the
      # pip-installed UPSTREAM zipnn 0.5.4 (source build on the runner).
      - name: L5 official-zipnn cross-validation (ubuntu GIL cell only)
        if: matrix.tag == 'linux-x86_64'
        run: |
          uv pip install --system zipnn==0.5.4
          python3 scripts/l5/official_cross.py

  fuzz-smoke:
    # L3 cargo-fuzz smoke (Plan §5.1 L3): 7 targets x 60 s with ASan on every
    # push/PR (Phase 2 adds st_parse + blob_decompress — the hostile
    # container / blob surface of the safetensors pipeline, §4.4.2; Phase 7 T7
    # adds webp_decode — the hostile-WebP preview decode surface). The
    # >=8 h budget runs in fuzz-long.yml (scheduled/dispatch), NOT on the
    # PR path (Plan: long runs are not PR gates).
    # Ghost-run guard — see native-test.
    if: github.event_name != 'pull_request' || startsWith(github.ref, 'refs/pull/')
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/crates/znn-codec/fuzz
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # Cache write policy — see native-test. (The 7 x 3 h fuzz-long workflow
      # caches the same workspace under its own job key; its schedule runs on
      # the default branch, so it keeps writing there.)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/crates/znn-codec/fuzz
          save-if: >-
            ${{ github.event_name != 'pull_request' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      - name: Install mold + clang (sanitizer linking)
        # A hung `apt-get` (mirror stall) once burned the full 6 h job limit and
        # got the whole push run cancelled (2026-09-30, run #80, native-test
        # ubuntu: the step ran 14:36 -> 20:37 without output). A 10 min step
        # budget fails fast instead - the job goes red in minutes and a re-run
        # picks a healthy mirror (the same step took <20 s in runs #79/#81).
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold
          sudo ln -sf "$(command -v mold)" /usr/local/bin/ld.mold

      # Pinned cargo-fuzz 0.12.0 (0.13.x defaults to a musl target whose
      # libFuzzer build needs x86_64-linux-musl-g++, unavailable on runners;
      # gnu + ASan is the supported path). Official release binary.
      - name: Install cargo-fuzz 0.12.0 (pinned)
        run: |
          curl -sSfL https://github.com/rust-fuzz/cargo-fuzz/releases/download/0.12.0/cargo-fuzz-0.12.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xz -C /tmp
          sudo install -m 755 /tmp/cargo-fuzz "$HOME/.cargo/bin/cargo-fuzz"
          cargo fuzz --version

      - name: Build fuzz targets (dev + ASan, gnu target)
        run: cargo +nightly fuzz build -D --target x86_64-unknown-linux-gnu

      - name: Smoke-fuzz all seven targets (60 s each)
        run: |
          for t in huf_decompress zn_header codec_decompress st_parse blob_decompress delta_decompress webp_decode; do
            cargo +nightly fuzz run "$t" --target x86_64-unknown-linux-gnu --dev -- \
              -max_total_time=60 -rss_limit_mb=1024 -timeout=15
          done

      - name: Upload crash artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: native/crates/znn-codec/fuzz/artifacts/
          if-no-files-found: ignore

  pgo-measure:
    # NEO-PLAN-2026-002 Step 3 — the linux-x86_64 PGO PILOT (informational,
    # non-gating): builds an instrumented core, trains it with the
    # deterministic workload (scripts/pgo/train.py), then builds the baseline
    # and the PGO artifact through the SAME shipping path (zigbuild, glibc
    # 2.28, size gate) and measures them A/B in one session (steal-gated,
    # BENCH protocol). Gates:
    #   G2 (hard):  the profile must actually apply — wholesale no-op
    #               signatures fail the job (missing-ratio >= 50 %, zero
    #               execution counts, too few profiled functions, or a
    #               foreign profile). The benign fat-LTO/PGO inliner
    #               divergence (~13.8 % measured on run #106) passes and is
    #               reported — see scripts/pgo/g2_check.py for the rationale.
    #   G3 (hard):  the PGO artifact passes the same 5 MB size gate.
    #   G1 (soft):  compress AND decompress >= +3 % by the per-side MEDIAN
    #               ratio (Plan-2 §2.2; min/best reported alongside) — the
    #               verdict is printed to the job summary and decides whether
    #               Step 4 wires PGO into the shipping build jobs. It does
    #               NOT fail the job (measurement noise on shared runners must
    #               not block unrelated pushes). The verdict statistic was
    #               min until run #108: min-of-N compares whichever unlucky
    #               round each side drew and flipped PASS (#107) -> NOT MET
    #               (#108) on an unchanged steady-state reality — BENCH §13.6.
    # Triggers: workflow_dispatch, or a push whose HEAD commit message carries
    # the [pgo-measure] marker — the marker exists because the session PAT
    # cannot dispatch (403, MEMO §1.2); it gives the same on-demand semantics
    # without burning ~25 runner-minutes on every push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[pgo-measure]'))
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: llvm-tools-preview

      # Cache write policy — see native-test.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: >-
            ${{ github.event_name != 'pull_request' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install cross toolchain (pinned, same as native-build-linux)
        run: uv pip install --system cargo-zigbuild==0.23.4 ziglang==0.16.0

      # 1/6 — instrumented build. Host-native (not zigbuild): the training run
      # executes on THIS runner, so the instrumented artifact does not need
      # the glibc floor. `--target` keeps RUSTFLAGS off the build scripts
      # (rustc book PGO chapter). The instrumented .so is copied aside before
      # the zigbuilds reuse the same target directory.
      - name: Build the instrumented core (host, release)
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pgo-prof" && mkdir -p "$RUNNER_TEMP/pgo-prof" "$RUNNER_TEMP/pgo-inst"
          cd native
          # Same commit stamp build-native.sh uses, so the version constant is
          # identical between the instrumented and the optimized build (one
          # less source of function-hash divergence).
          MM_CORE_COMMIT="$(git rev-parse --short=9 HEAD 2>/dev/null || echo dev)" \
          RUSTFLAGS="-Cprofile-generate=$RUNNER_TEMP/pgo-prof" \
            cargo build --release -p mm-core --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/libmm_core.so "$RUNNER_TEMP/pgo-inst/mm_core.abi3.so"

      # 2/6 — train: the deterministic workload runs the instrumented core
      # through every hot surface (compress/decompress/delta/scan/hygiene/
      # hash/header/tree/webp/walk/move). profraw files land via
      # LLVM_PROFILE_FILE; the summary JSON doubles as the training report.
      - name: Train the instrumented core (scripts/pgo/train.py)
        run: |
          set -euo pipefail
          LLVM_PROFILE_FILE="$RUNNER_TEMP/pgo-prof/default_%m.profraw" \
            python scripts/pgo/train.py --lib-dir "$RUNNER_TEMP/pgo-inst" \
            --workdir "$RUNNER_TEMP/pgo-work" --json-out "$RUNNER_TEMP/pgo-train.json"

      # 3/6 — merge + record the profiled-function count (the G2 denominator).
      - name: Merge profiles (llvm-profdata)
        run: |
          set -euo pipefail
          LLVM_BIN="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin"
          "$LLVM_BIN/llvm-profdata" merge -o "$RUNNER_TEMP/pgo-prof/merged.profdata" "$RUNNER_TEMP/pgo-prof"
          "$LLVM_BIN/llvm-profdata" show "$RUNNER_TEMP/pgo-prof/merged.profdata" | tee "$RUNNER_TEMP/pgo-prof/show.txt"
          "$LLVM_BIN/llvm-profdata" show --all-functions "$RUNNER_TEMP/pgo-prof/merged.profdata" > "$RUNNER_TEMP/pgo-prof/allfuncs.txt"
          ls -l "$RUNNER_TEMP/pgo-prof/merged.profdata"

      # 4/6 — the two shipping-path artifacts: baseline first (copied aside),
      # then the PGO build through `build-native.sh --pgo` (same zigbuild +
      # glibc floor + size gate = G3 is enforced by the script itself). The
      # PGO build log is teed for the G2 warn-count assert.
      - name: Build baseline + PGO artifacts (zigbuild, glibc 2.28)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ab/baseline" "$RUNNER_TEMP/ab/pgo"
          ./scripts/build-native.sh --target linux-x86_64 --size-gate
          cp native/native-bin/linux-x86_64/mm_core.abi3.so "$RUNNER_TEMP/ab/baseline/"
          ./scripts/build-native.sh --target linux-x86_64 --size-gate \
            --pgo "$RUNNER_TEMP/pgo-prof/merged.profdata" 2>&1 | tee "$RUNNER_TEMP/pgo-build.log"
          cp native/native-bin/linux-x86_64/mm_core.abi3.so "$RUNNER_TEMP/ab/pgo/"

      # 5/6 — G2 (hard): the profile must actually have been applied.
      # RECALIBRATED on run #106 evidence (Plan-2 v1.2): under the shipping
      # release profile (fat LTO + CGU=1) the PGO inliner legitimately
      # diverges from the instrumented build — #106 measured 13.81 % of the
      # optimized build's functions without a profile record (518 generic
      # instantiations + 254 closure identities + 485 out-of-line
      # re-materializations of functions that were fully inlined during
      # instrumentation), while the profile demonstrably applied (Total
      # count 1.21e9). The original < 1 % threshold (calibrated on a
      # dev-profile experiment) was therefore wrong for release+LTO; the
      # gate now fails only on wholesale no-op signatures — near-total
      # mismatch (>= 50 %), zero execution counts, implausibly few profiled
      # functions, or a profile that is not from this workspace. Full
      # rationale + mutation-tested detection: scripts/pgo/g2_check.py.
      - name: "G2 gate: the profile applied (no-op detection)"
        run: |
          set -euo pipefail
          python scripts/pgo/g2_check.py \
            "$RUNNER_TEMP/pgo-prof/show.txt" \
            "$RUNNER_TEMP/pgo-build.log" \
            --all-functions-txt "$RUNNER_TEMP/pgo-prof/allfuncs.txt" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # 6/6 — G1 measurement (soft) + report. train.py --measure alternates
      # A/B subprocesses (5 rounds), steal-gates each window and judges on
      # the per-side MEDIAN (Plan-2 §2.2); min/best are reported alongside.
      # The verdict is informational: it decides Step 4 (wiring PGO into the
      # shipping jobs), it does not fail this job.
      - name: "G1 measurement: baseline vs PGO (A/B, steal-gated)"
        run: |
          set -euo pipefail
          python scripts/pgo/train.py --measure \
            --a "$RUNNER_TEMP/ab/baseline" --b "$RUNNER_TEMP/ab/pgo" \
            --rounds 5 --workdir "$RUNNER_TEMP/pgo-measure-work" \
            --json-out "$RUNNER_TEMP/pgo-measure.json" | tee "$RUNNER_TEMP/pgo-measure.log"
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          data = json.load(open(os.environ["RUNNER_TEMP"] + "/pgo-measure.json"))
          wl = data["workloads"]
          rows = [
              "| workload | ratio (median) | ratio (min) | ratio (best) | baseline median | pgo median |",
              "| --- | --- | --- | --- | --- | --- |",
          ]
          for name, row in wl.items():
              rows.append(
                  f"| {name} | **{row['ratioMed']}** | {row['ratioMin']} | {row['ratioBest']} "
                  f"| {row['baselineMed']} | {row['pgoMed']} |"
              )
          print("## pgo-measure (linux-x86_64)\n")
          print("\n".join(rows))
          # Per-round samples (run #107 lesson): summary ratios alone hid
          # that round 0 is cold on BOTH sides and that short workloads
          # (scan: 15-95 ms windows) have same-binary between-round variance
          # larger than the effect. Run #108 added the second half of the
          # lesson: the per-round table is also what EXONERATES a bad min
          # ratio (compress min x0.7575 came from one noise-degraded round
          # on each side, not from a regression) — BENCH §13.6.
          names = list(wl)
          hdr = "| round | side | " + " | ".join(names) + " |"
          sep = "| --- | --- | " + " | ".join("---" for _ in names) + " |"
          per = [hdr, sep]
          for r in range(data["rounds"]):
              for side, key in (("a baseline", "roundsA"), ("b pgo", "roundsB")):
                  cells = []
                  for name in names:
                      arr = wl[name].get(key) or []
                      cells.append(str(arr[r]) if r < len(arr) else "-")
                  per.append(f"| {r} | {side} | " + " | ".join(cells) + " |")
          print("\n### per-round samples (round 0 = cold first run on both sides)\n")
          print("\n".join(per))
          c, d = wl["compress"]["ratioMed"], wl["decompress"]["ratioMed"]
          ok = c is not None and d is not None and c >= 1.03 and d >= 1.03
          print(f"\n**G1 (+3 % on compress AND decompress, per-side median): {'PASS' if ok else 'NOT MET'}**"
                f" (compress x{c}, decompress x{d}; min x{wl['compress']['ratioMin']}/x{wl['decompress']['ratioMin']},"
                f" best x{wl['compress']['ratioBest']}/x{wl['decompress']['ratioBest']};"
                f" discarded steal windows: {data['discardedStealWindows']},"
                f" contaminated samples: {data['contaminatedSamples']})")
          # Regression watch (informational): any workload materially slower
          # under PGO is surfaced, not hidden behind the G1 headline. It
          # judges on the MEDIAN — the min ratio is a worst-window statistic
          # and flips on round luck (#107 scan x0.349, #108 compress x0.7575
          # were both artifacts; see the per-round table above and BENCH
          # §13.1/§13.6). A median below 0.95 means the SLOWER half of the
          # PGO rounds still lost to the faster half of the baseline rounds.
          slow = {k: v["ratioMed"] for k, v in wl.items() if v["ratioMed"] is not None and v["ratioMed"] < 0.95}
          if slow:
              print(f"\n**REGRESSION WATCH**: slower under PGO (median): {slow} — see Plan-2 R7 (train weighting) / BENCH §13")
          print(f"\nenv: {data['env']}")
          PY
          base_size=$(stat -c %s "$RUNNER_TEMP/ab/baseline/mm_core.abi3.so")
          pgo_size=$(stat -c %s "$RUNNER_TEMP/ab/pgo/mm_core.abi3.so")
          {
            echo ""
            echo "Sizes: baseline ${base_size} B / pgo ${pgo_size} B (budget 5242880 B; G3 enforced by --size-gate above)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: pgo-measure-report
          path: |
            ${{ runner.temp }}/pgo-measure.json
            ${{ runner.temp }}/pgo-measure.log
            ${{ runner.temp }}/pgo-train.json
            ${{ runner.temp }}/pgo-build.log
          if-no-files-found: error

  publish-native-bin:
    # Phase 8 distribution (Plan §5.3 / K16): on `main` pushes, commit the
    # eight freshly built platform binaries (4 abi3 + 4 abi3t — NEO-PLAN-
    # 2026-003) back into native/native-bin/ so a fresh clone runs the ZipNN
    # engine with NO compiler, NO pip and NO network. dev/PR runs never
    # publish (their artifacts are verification only); release tags ship
    # whatever main already carries. The push uses the default GITHUB_TOKEN
    # (contents: write) and GitHub does not trigger new workflow runs for
    # token-created commits, so this cannot loop.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [native-build-linux, native-build-macos, native-build-windows]
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: native-bin-*
          path: artifacts
          merge-multiple: true

      # download-artifact's layout is the uploads' least-common ancestor, so
      # the `<tag>` directory segment can vanish for single-file artifacts
      # (the size-budget job's FAT_MAGIC note). NEO-PLAN-2026-003: all three
      # build jobs now upload BOTH flavours WITH their directory structure,
      # so staging is DIRECTORY-TAG-FIRST; content classification (ELF
      # e_machine x86_64/aarch64, Mach-O FAT magic, the .abi3t.so name) is
      # the fallback. The fallback deliberately REFUSES a bare .pyd: the GIL
      # and the t windows binary share one filename (mm_core.pyd — PEP 803
      # keeps the plain Windows suffix), so only the directory tag can tell
      # them apart (Plan-3 R7 — a mis-staged pair would ship the abi3 binary
      # to free-threaded users, whose interpreters reject it at load).
      - name: Stage the eight platform binaries into native/native-bin/
        run: |
          python3 - <<'PY'
          import pathlib, shutil, sys

          targets = {
              "linux-x86_64": "mm_core.abi3.so",
              "linux-aarch64": "mm_core.abi3.so",
              "macos-universal2": "mm_core.abi3.so",
              "windows-x86_64": "mm_core.pyd",
              "linux-x86_64t": "mm_core.abi3t.so",
              "linux-aarch64t": "mm_core.abi3t.so",
              "macos-universal2t": "mm_core.abi3t.so",
              "windows-x86_64t": "mm_core.pyd",
          }

          def classify(path):
              # 1) the directory tag wins (uploads carry the <tag>/ segment).
              parent = path.parent.name
              if parent in targets:
                  return parent
              # 2) content + filename fallback (the LCA can strip the tag dir).
              head = path.read_bytes()[:4]
              if path.suffix == ".pyd":
                  return None  # bare .pyd cannot distinguish GIL from t (R7)
              is_t = path.name.endswith(".abi3t.so")
              if head == b"\x7fELF":
                  machine = int.from_bytes(path.read_bytes()[18:20], "little")
                  base = {0x3E: "linux-x86_64", 0xB7: "linux-aarch64"}.get(machine)
                  if base is None:
                      return None
                  return base + "t" if is_t else base
              if head.hex() in ("cafebabe", "cafebabf"):
                  return "macos-universal2t" if is_t else "macos-universal2"
              return None

          found = {}
          for path in sorted(pathlib.Path("artifacts").rglob("*")):
              if not path.is_file() or path.suffix not in (".so", ".pyd"):
                  continue
              tag = classify(path)
              if tag is None:
                  sys.exit(f"cannot classify artifact {path} (no <tag> directory segment and no content signature)")
              if tag in found:
                  sys.exit(f"duplicate artifact for {tag}: {found[tag]} and {path}")
              found[tag] = path
          missing = sorted(set(targets) - set(found))
          if missing:
              sys.exit(f"missing platform binaries: {missing}")
          for tag, name in targets.items():
              out = pathlib.Path("native/native-bin") / tag
              out.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(found[tag], out / name)
              print(f"staged {found[tag]} -> {out / name} ({(out / name).stat().st_size} bytes)")
          PY

      - name: Verify all eight platform binaries are staged in the worktree
        run: |
          set -euo pipefail
          for f in native/native-bin/linux-x86_64/mm_core.abi3.so \
                   native/native-bin/linux-aarch64/mm_core.abi3.so \
                   native/native-bin/macos-universal2/mm_core.abi3.so \
                   native/native-bin/windows-x86_64/mm_core.pyd \
                   native/native-bin/linux-x86_64t/mm_core.abi3t.so \
                   native/native-bin/linux-aarch64t/mm_core.abi3t.so \
                   native/native-bin/macos-universal2t/mm_core.abi3t.so \
                   native/native-bin/windows-x86_64t/mm_core.pyd; do
            test -s "$f" || { echo "BUG: $f is missing or empty"; exit 1; }
          done

      # The *.so ignore in .gitignore is deliberate for dev/PR worktrees (a
      # local debug build must never be committed by accident); THIS job is
      # the single authorised publisher and force-adds the release artifacts.
      - name: Commit & push (no-op when the binaries are unchanged)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f native/native-bin
          if git diff --cached --quiet; then
            echo "native-bin is byte-identical to HEAD - nothing to commit"
          else
            git commit -m "chore(native-bin): rebuild the prebuilt mm_core artifacts from ${GITHUB_SHA::7}

          Generated by the publish-native-bin job (Plan §5.3 / Phase 8):
          the eight platform binaries (linux x86_64/aarch64 glibc>=2.28,
          macos universal2, windows x86_64 — each as abi3 AND, for
          free-threaded CPython 3.15+, abi3t; NEO-PLAN-2026-003) that a
          fresh clone imports directly - no compiler, no pip, no network
          (K16)."
            git push
          fi
