# Long-running L3 fuzz budget (">=8 hours, 0 panic/OOM/hang" — the Phase 1
# completion condition "fuzz >=8 h"). GitHub's 6 h per-job limit
# means the budget runs as a 7-target matrix x 3 h = 21 h total per schedule
# (each job well inside the limit; Phase 2 added st_parse + blob_decompress,
# Phase 3 delta_decompress).
# Crashes fail the job and are uploaded as artifacts; the committed corpus
# (incl. the Phase-1 regression seeds found by the fuzzer) replays every run.
# The former l2-full companion (the >=10,000-case golden differential against
# the bundled C core) was retired in Phase 8 together with third_party/; its
# committed evidence stays under scripts/bench/results/ (l2_*.json).
#
# NOT a PR gate — scheduled (weekly) + manual dispatch only.
name: fuzz-long

on:
  schedule:
    - cron: "0 18 * * 0" # Sundays 18:00 UTC
  workflow_dispatch:
    inputs:
      hours:
        description: "Fuzz hours PER TARGET (matrix runs in parallel)"
        default: "3"
        type: choice
        options: ["1", "2", "3", "4", "5"]

concurrency:
  group: fuzz-long
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            huf_decompress,
            zn_header,
            codec_decompress,
            st_parse,
            blob_decompress,
            delta_decompress,
            webp_decode,
          ]
    defaults:
      run:
        working-directory: native/crates/znn-codec/fuzz
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # Cache write policy — see native.yml's native-test for the full rationale
      # (10 GB/repo, per-ref scope). This workflow's schedule runs on the
      # default branch, so `github.event_name == 'schedule'` still writes; only
      # dispatches from a throwaway branch are restore-only. Losing this cache
      # is expensive here: the 7 ASan nightly fuzz targets would rebuild from
      # scratch (measured 2026-10-03: the fuzz-long entry had already been
      # LRU-evicted by the PR/tag copies).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/crates/znn-codec/fuzz
          save-if: >-
            ${{ github.event_name != 'pull_request' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      # No apt step: fuzz builds link with nightly's default rust-lld and the
      # ASan runtime ships inside rustc (self-contained compiler-rt,
      # linker-independent) - see native/.cargo/config.toml's linker policy.
      # Neither mold nor clang is referenced by any fuzz invocation (no
      # -fuse-ld=mold anywhere). Dropping apt also removes the mirror-stall
      # failure surface this step once guarded (a hung `apt-get` burned the
      # full 6 h job limit and cancelled the whole push run - 2026-09-30,
      # run #80).
      - name: Install cargo-fuzz 0.12.0 (pinned — see fuzz-smoke note)
        run: |
          curl -sSfL https://github.com/rust-fuzz/cargo-fuzz/releases/download/0.12.0/cargo-fuzz-0.12.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xz -C /tmp
          sudo install -m 755 /tmp/cargo-fuzz "$HOME/.cargo/bin/cargo-fuzz"
          cargo fuzz --version

      - name: Build fuzz target (release + ASan, gnu)
        run: cargo +nightly fuzz build -O --target x86_64-unknown-linux-gnu "${{ matrix.target }}"

      - name: Fuzz ${{ matrix.target }} for the scheduled budget
        env:
          # template-injection hardening (zizmor): dispatch input via env
          # binding instead of direct ${{ }} expansion in the run block.
          FUZZ_HOURS: ${{ github.event.inputs.hours || '3' }}
        run: |
          HOURS="$FUZZ_HOURS"
          SECS=$(( HOURS * 3600 ))
          # ASan allocator tuning: the default quarantine (256 MB) + lazy
          # page release retains hundreds of MB of already-freed pages over
          # a 3 h run — that tripped the old 2048 MB rss_limit in the first
          # blob_decompress long run (live heap was ~25 MB; not a leak).
          # Small quarantine + eager release keeps RSS near-flat:
          # 427 MB -> 127 MB in a matched local A/B (410 k execs).
          export ASAN_OPTIONS="quarantine_size_mb=32:release_to_os_interval_ms=200"
          # rss_limit 4096: headroom for the (decaying) residual retention.
          cargo +nightly fuzz run "${{ matrix.target }}" \
            --target x86_64-unknown-linux-gnu -- \
            -max_total_time="$SECS" -rss_limit_mb=4096 -timeout=30 \
            -artifact_prefix=artifacts/${{ matrix.target }}/

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: native/crates/znn-codec/fuzz/artifacts/
          if-no-files-found: ignore
