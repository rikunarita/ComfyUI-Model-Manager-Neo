# TEMPORARY optimization probe — NOT for merge.
#
# One-shot measurement harness used to decide, with this repository's own
# Actions runners, whether each candidate optimization is shipped:
#
#   probe-linux-x86-64-v2-v3  baseline vs -C target-cpu=x86-64-v2 / v3 (+ v4 build-only)
#   probe-linux-aarch64-pgo   instrumented build + merge + zigbuild shipping path + A/B
#   probe-linux-abi3t-pgo     free-threaded (abi3t) build with -Cprofile-generate + A/B under 3.15t
#   probe-windows-arm64-pgo   windows-arm64 GIL artifact: maturin --pgo vs baseline (A/B)
#   probe-windows-arm64t-pgo  windows-arm64t abi3t artifact: direct maturin --pgo (feasibility)
#   probe-macos-arm64-pgo     arm64-ONLY macOS build with -Cprofile-use (the universal2 FAT SIGSEGV workaround)
#   probe-cold-build          from-scratch zigbuild wall time with NO caches (cache policy input)
#
# Triggers: workflow_dispatch (if the token has Actions permission) or a push
# to dev whose HEAD commit message carries [optimization-probe].
# Artifacts (report JSONs) expire after 1 day; the decisions live in
# docs/BENCH.md + Agent/MEMO.md afterwards. RETAIN THIS FILE: no — delete it
# after the results land.

name: optimization-probe

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: optimization-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  probe-linux-x86-64-v2-v3:
    # baseline vs x86-64-v2 and -v3 code generation. The measure step runs on
    # the runner's own CPU; the runner family is recorded in the report so
    # the verdict names its hardware. x86-64-v4 is BUILD-ONLY: whether the
    # runner has AVX-512 is checked at runtime.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[optimization-probe]')
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable # floating branch by policy; see .github/zizmor.yml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install cross toolchain (pinned)
        env:
          UV_MALWARE_CHECK: "1"
        run: uv pip install --system cargo-zigbuild==0.23.4 ziglang==0.16.0
      - name: Build baseline, v2 and v3 artifacts (zigbuild)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ab/baseline" "$RUNNER_TEMP/ab/v2" "$RUNNER_TEMP/ab/v3" "$RUNNER_TEMP/ab/v4"
          ./scripts/build-native.sh --target linux-x86_64 --size-gate
          cp native/native-bin/linux-x86_64/mm_core.abi3.so "$RUNNER_TEMP/ab/baseline/"
          RUSTFLAGS="-C target-cpu=x86-64-v2" ./scripts/build-native.sh --target linux-x86_64 --size-gate
          cp native/native-bin/linux-x86_64/mm_core.abi3.so "$RUNNER_TEMP/ab/v2/"
          RUSTFLAGS="-C target-cpu=x86-64-v3" ./scripts/build-native.sh --target linux-x86_64 --size-gate
          cp native/native-bin/linux-x86_64/mm_core.abi3.so "$RUNNER_TEMP/ab/v3/"
          echo "== cpuinfo"; grep -m1 -o -E 'avx512f|avx2|sse4_2' /proc/cpuinfo | sort | uniq -c | head
          echo "== sizes"; stat -c '%s %n' "$RUNNER_TEMP/ab/baseline/"* "$RUNNER_TEMP/ab/v2/"* "$RUNNER_TEMP/ab/v3/"* | grep -v orig
      - name: A/B measure (baseline vs v2, baseline vs v3), median of 5 rounds
        run: |
          set -euo pipefail
          python scripts/pgo/train.py --measure --a "$RUNNER_TEMP/ab/baseline" --b "$RUNNER_TEMP/ab/v2" \
            --rounds 5 --workdir "$RUNNER_TEMP/probe-v2-work" --json-out "$RUNNER_TEMP/probe-v2.json"
          python scripts/pgo/train.py --measure --a "$RUNNER_TEMP/ab/baseline" --b "$RUNNER_TEMP/ab/v3" \
            --rounds 5 --workdir "$RUNNER_TEMP/probe-v3-work" --json-out "$RUNNER_TEMP/probe-v3.json"
      - name: x86-64-v4 build-only probe (runtime gated)
        run: |
          set -euo pipefail
          if grep -qw avx512f /proc/cpuinfo; then
            RUSTFLAGS="-C target-cpu=x86-64-v4" ./scripts/build-native.sh --target linux-x86_64 --size-gate
            cp native/native-bin/linux-x86_64/mm_core.abi3.so "$RUNNER_TEMP/ab/v4/"
            echo "v4 build OK; runner has AVX-512F"
          else
            echo "runner lacks AVX-512F — v4 build skipped (would build anywhere but cannot be verified or benched here)"
          fi
      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-linux-x86-64-v2-v3
          retention-days: 1
          path: |
            ${{ runner.temp }}/probe-v2.json
            ${{ runner.temp }}/probe-v3.json
            ${{ runner.temp }}/ab/*/mm_core.abi3.so*

  probe-linux-aarch64-pgo:
    # Full manual 3-phase PGO on a native ARM64 Ubuntu runner (instrument ->
    # train -> merge -> zigbuild with -Cprofile-use), then A/B measure.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[optimization-probe]')
    timeout-minutes: 45
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable # floating branch by policy; see .github/zizmor.yml
        with:
          targets: aarch64-unknown-linux-gnu
          components: llvm-tools-preview
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: arm64
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install cross toolchain (pinned)
        env:
          UV_MALWARE_CHECK: "1"
        run: uv pip install --system cargo-zigbuild==0.23.4 ziglang==0.16.0
      - name: Build the instrumented core (host, release)
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pgo-prof" && mkdir -p "$RUNNER_TEMP/pgo-prof" "$RUNNER_TEMP/pgo-inst"
          cd native
          MM_CORE_COMMIT="$(git rev-parse --short=9 HEAD 2>/dev/null || echo dev)" \
          RUSTFLAGS="-Cprofile-generate=$RUNNER_TEMP/pgo-prof" \
            cargo build --release -p mm-core --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/libmm_core.so "$RUNNER_TEMP/pgo-inst/mm_core.abi3.so"
      - name: Train the instrumented core (scripts/pgo/train.py)
        run: |
          set -euo pipefail
          LLVM_PROFILE_FILE="$RUNNER_TEMP/pgo-prof/default_%m.profraw" \
            python scripts/pgo/train.py --lib-dir "$RUNNER_TEMP/pgo-inst" \
            --workdir "$RUNNER_TEMP/pgo-work" --json-out "$RUNNER_TEMP/pgo-train.json"
      - name: Merge profiles (llvm-profdata)
        run: |
          set -euo pipefail
          LLVM_BIN="$(rustc --print sysroot)/lib/rustlib/aarch64-unknown-linux-gnu/bin"
          "$LLVM_BIN/llvm-profdata" merge -o "$RUNNER_TEMP/pgo-prof/merged.profdata" "$RUNNER_TEMP/pgo-prof"
          "$LLVM_BIN/llvm-profdata" show "$RUNNER_TEMP/pgo-prof/merged.profdata" | tee "$RUNNER_TEMP/pgo-prof/show.txt"
          ls -l "$RUNNER_TEMP/pgo-prof/merged.profdata"
      - name: Build baseline + PGO artifacts (zigbuild)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ab/baseline" "$RUNNER_TEMP/ab/pgo"
          ./scripts/build-native.sh --target linux-aarch64 --size-gate
          cp native/native-bin/linux-aarch64/mm_core.abi3.so "$RUNNER_TEMP/ab/baseline/"
          ./scripts/build-native.sh --target linux-aarch64 --size-gate \
            --pgo "$RUNNER_TEMP/pgo-prof/merged.profdata" 2>&1 | tee "$RUNNER_TEMP/pgo-build.log"
          cp native/native-bin/linux-aarch64/mm_core.abi3.so "$RUNNER_TEMP/ab/pgo/"
      - name: "profile-applied check: the profile applied (no-op detection)"
        run: |
          set -euo pipefail
          python scripts/pgo/profile_check.py \
            "$RUNNER_TEMP/pgo-prof/show.txt" \
            "$RUNNER_TEMP/pgo-build.log" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: A/B measure (baseline vs PGO), median of 5 rounds
        run: |
          set -euo pipefail
          python scripts/pgo/train.py --measure \
            --a "$RUNNER_TEMP/ab/baseline" --b "$RUNNER_TEMP/ab/pgo" \
            --rounds 5 --workdir "$RUNNER_TEMP/probe-aarch64-work" --json-out "$RUNNER_TEMP/probe-aarch64.json" \
            | tee "$RUNNER_TEMP/probe-aarch64.log"
          base_size=$(stat -c %s "$RUNNER_TEMP/ab/baseline/mm_core.abi3.so")
          pgo_size=$(stat -c %s "$RUNNER_TEMP/ab/pgo/mm_core.abi3.so")
          {
            echo "## probe-linux-aarch64-pgo"
            echo "Sizes: baseline ${base_size} B / pgo ${pgo_size} B (budget 5242880 B)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-linux-aarch64-pgo
          retention-days: 1
          path: |
            ${{ runner.temp }}/probe-aarch64.json
            ${{ runner.temp }}/probe-aarch64.log
            ${{ runner.temp }}/pgo-train.json
            ${{ runner.temp }}/pgo-build.log

  probe-linux-abi3t-pgo:
    # free-threaded (abi3t) instrumented build under CPython 3.15t, merge,
    # rebuild with -Cprofile-use, A/B measure under 3.15t. This is the probe
    # for whether the <tag>t family can leave non-PGO later.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[optimization-probe]')
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable # floating branch by policy; see .github/zizmor.yml
        with:
          targets: x86_64-unknown-linux-gnu
          components: llvm-tools-preview
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          freethreaded: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install cross toolchain (pinned)
        env:
          UV_MALWARE_CHECK: "1"
        run: uv pip install --system cargo-zigbuild==0.23.4 ziglang==0.16.0
      - name: Build baseline abi3t artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ab/baseline"
          ./scripts/build-native.sh --target linux-x86_64t --size-gate
          cp native/native-bin/linux-x86_64t/mm_core.abi3t.so "$RUNNER_TEMP/ab/baseline/"
      - name: Build the instrumented abi3t core (host, release)
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pgo-prof" && mkdir -p "$RUNNER_TEMP/pgo-prof" "$RUNNER_TEMP/pgo-inst"
          cd native
          MM_CORE_COMMIT="$(git rev-parse --short=9 HEAD 2>/dev/null || echo dev)" \
          RUSTFLAGS="-Cprofile-generate=$RUNNER_TEMP/pgo-prof" \
            cargo build --release -p mm-core --no-default-features --features extension-module,ft --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/libmm_core.so "$RUNNER_TEMP/pgo-inst/mm_core.abi3t.so"
      - name: Train the instrumented core (3.15t)
        run: |
          set -euo pipefail
          LLVM_PROFILE_FILE="$RUNNER_TEMP/pgo-prof/default_%m.profraw" \
            python scripts/pgo/train.py --lib-dir "$RUNNER_TEMP/pgo-inst" \
            --workdir "$RUNNER_TEMP/pgo-work" --json-out "$RUNNER_TEMP/pgo-train.json"
      - name: Merge profiles (llvm-profdata)
        run: |
          set -euo pipefail
          LLVM_BIN="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin"
          "$LLVM_BIN/llvm-profdata" merge -o "$RUNNER_TEMP/pgo-prof/merged.profdata" "$RUNNER_TEMP/pgo-prof"
          "$LLVM_BIN/llvm-profdata" show "$RUNNER_TEMP/pgo-prof/merged.profdata" | tee "$RUNNER_TEMP/pgo-prof/show.txt"
      - name: Build the PGO abi3t artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ab/pgo"
          cd native
          MM_CORE_COMMIT="$(git rev-parse --short=9 HEAD 2>/dev/null || echo dev)" \
          RUSTFLAGS="-Cprofile-use=$RUNNER_TEMP/pgo-prof/merged.profdata -Cllvm-args=-pgo-warn-missing-function" \
            cargo build --release -p mm-core --no-default-features --features extension-module,ft --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/libmm_core.so "$RUNNER_TEMP/ab/pgo/mm_core.abi3t.so"
          size=$(stat -c %s "$RUNNER_TEMP/ab/pgo/mm_core.abi3t.so")
          echo "PGO abi3t artifact: $size bytes (budget 5242880)"
          [ "$size" -le 5242880 ] || { echo "SIZE BUDGET EXCEEDED"; exit 1; }
      - name: A/B measure under 3.15t (baseline vs PGO)
        run: |
          set -euo pipefail
          python scripts/pgo/train.py --measure \
            --a "$RUNNER_TEMP/ab/baseline" --b "$RUNNER_TEMP/ab/pgo" \
            --rounds 5 --workdir "$RUNNER_TEMP/probe-abi3t-work" --json-out "$RUNNER_TEMP/probe-abi3t.json" \
            | tee "$RUNNER_TEMP/probe-abi3t.log"
      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-linux-abi3t-pgo
          retention-days: 1
          path: |
            ${{ runner.temp }}/probe-abi3t.json
            ${{ runner.temp }}/probe-abi3t.log
            ${{ runner.temp }}/pgo-train.json

  probe-windows-arm64-pgo:
    # The windows-arm64 GIL artifact through maturin --pgo (the same
    # three-phase flow the windows x86_64 GIL build uses), then A/B measure.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[optimization-probe]')
    timeout-minutes: 45
    runs-on: windows-11-vs2026-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable # floating branch by policy; see .github/zizmor.yml
        with:
          components: llvm-tools-preview
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: arm64
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install maturin (pinned)
        env:
          UV_MALWARE_CHECK: "1"
        run: uv pip install --system maturin==1.15.0
      - name: Build baseline + PGO artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ab/baseline" "$RUNNER_TEMP/ab/pgo"
          ./scripts/build-native.sh --target windows-arm64 --size-gate
          cp native/native-bin/windows-arm64/mm_core.pyd "$RUNNER_TEMP/ab/baseline/"
          ./scripts/build-native.sh --target windows-arm64 --size-gate --pgo-train 2>&1 | tee "$RUNNER_TEMP/pgo-build.log"
          cp native/native-bin/windows-arm64/mm_core.pyd "$RUNNER_TEMP/ab/pgo/"
      - name: A/B measure (baseline vs PGO)
        run: |
          set -euo pipefail
          python scripts/pgo/train.py --measure \
            --a "$RUNNER_TEMP/ab/baseline" --b "$RUNNER_TEMP/ab/pgo" \
            --rounds 5 --workdir "$RUNNER_TEMP/probe-win-arm64-work" --json-out "$RUNNER_TEMP/probe-windows-arm64.json" \
            | tee "$RUNNER_TEMP/probe-windows-arm64.log"
          ls -la "$RUNNER_TEMP/ab/baseline" "$RUNNER_TEMP/ab/pgo"
      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-windows-arm64-pgo
          retention-days: 1
          path: |
            ${{ runner.temp }}/probe-windows-arm64.json
            ${{ runner.temp }}/probe-windows-arm64.log
            ${{ runner.temp }}/pgo-build.log

  probe-windows-arm64t-pgo:
    # The windows-arm64t abi3t artifact through a direct `maturin build --pgo`
    # (the shipping path deliberately keeps abi3t non-PGO — this probe is the
    # feasibility test, it does NOT change the shipping configuration).
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[optimization-probe]')
    timeout-minutes: 45
    runs-on: windows-11-vs2026-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable # floating branch by policy; see .github/zizmor.yml
        with:
          components: llvm-tools-preview
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          architecture: arm64
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install maturin (pinned)
        env:
          UV_MALWARE_CHECK: "1"
        run: uv pip install --system maturin==1.15.0
      - name: Build baseline abi3t artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ab/baseline"
          ./scripts/build-native.sh --target windows-arm64t --size-gate
          cp native/native-bin/windows-arm64t/mm_core.pyd "$RUNNER_TEMP/ab/baseline/"
      - name: maturin --pgo (abi3t, arm64) — feasibility
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ab/pgo" "$RUNNER_TEMP/probe-arm64t-wheels"
          cd native
          maturin build --release --no-default-features --features ft --pgo --out "$RUNNER_TEMP/probe-arm64t-wheels" 2>&1 | tee "$RUNNER_TEMP/pgo-build.log"
          cd ..
          python - "$RUNNER_TEMP/probe-arm64t-wheels" "$RUNNER_TEMP/ab/pgo/mm_core.pyd" <<'PY'
          import pathlib, sys, zipfile
          wheels = sorted(pathlib.Path(sys.argv[1]).glob("mm_core-*abi3t*win_arm64.whl"))
          assert wheels, f"no win_arm64 abi3t wheel in {sys.argv[1]}: {list(pathlib.Path(sys.argv[1]).glob('*'))}"
          with zipfile.ZipFile(wheels[-1]) as zf:
              names = [n for n in zf.namelist() if n.endswith("/mm_core.pyd")]
              assert len(names) == 1, names
              pathlib.Path(sys.argv[2]).write_bytes(zf.read(names[0]))
          print("extracted", wheels[-1].name)
          PY
          ls -la "$RUNNER_TEMP/ab/pgo"
      - name: Import smokes (GIL 3.15 + free-threaded 3.15t against the PGO .pyd)
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          PYTHONPATH="$RUNNER_TEMP/ab/pgo" python -c "import mm_core; print('abi3t PGO import OK (GIL 3.15):', mm_core.api_version(), mm_core.core_version())"
      - name: A/B measure (baseline vs PGO)
        run: |
          set -euo pipefail
          python scripts/pgo/train.py --measure \
            --a "$RUNNER_TEMP/ab/baseline" --b "$RUNNER_TEMP/ab/pgo" \
            --rounds 5 --workdir "$RUNNER_TEMP/probe-win-arm64t-work" --json-out "$RUNNER_TEMP/probe-windows-arm64t.json" \
            | tee "$RUNNER_TEMP/probe-windows-arm64t.log"
      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-windows-arm64t-pgo
          retention-days: 1
          path: |
            ${{ runner.temp }}/probe-windows-arm64t.json
            ${{ runner.temp }}/probe-windows-arm64t.log
            ${{ runner.temp }}/pgo-build.log

  probe-macos-arm64-pgo:
    # arm64-ONLY instrument -> train -> merge -> rebuild with -Cprofile-use,
    # sidestepping the universal2 FAT instrumented-dylib SIGSEGV seen with
    # `maturin --pgo --target universal2-apple-darwin`. NOTE: shipping an
    # arm64-only artifact would be a product decision (Intel Mac support
    # stays with the universal2 non-PGO artifact), this probe only measures
    # whether the SIGSEGV also reproduces in the arm64-only path.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[optimization-probe]')
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable # floating branch by policy; see .github/zizmor.yml
        with:
          targets: aarch64-apple-darwin
          components: llvm-tools-preview
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: arm64
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install maturin (pinned)
        env:
          UV_MALWARE_CHECK: "1"
        run: uv pip install --system maturin==1.15.0
      - name: Build baseline arm64-only artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ab/baseline"
          (cd native && maturin build --release --target aarch64-apple-darwin --out target/wheels)
          wheel="$(ls -t native/target/wheels/mm_core-*-cp312-abi3-*aarch64.whl | head -1)"
          python - "$wheel" "$RUNNER_TEMP/ab/baseline/mm_core.abi3.so" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = [n for n in zf.namelist() if n.endswith("mm_core.abi3.so")]
              assert len(names) == 1, names
              with zf.open(names[0]) as src, open(sys.argv[2], "wb") as dst:
                  dst.write(src.read())
          PY
          ls -la "$RUNNER_TEMP/ab/baseline/"
      - name: Build the instrumented arm64 core (host)
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pgo-prof" && mkdir -p "$RUNNER_TEMP/pgo-prof" "$RUNNER_TEMP/pgo-inst"
          (cd native && MM_CORE_COMMIT="$(git rev-parse --short=9 HEAD 2>/dev/null || echo dev)" \
            RUSTFLAGS="-Cprofile-generate=$RUNNER_TEMP/pgo-prof" \
            maturin build --release --target aarch64-apple-darwin --out target/wheels-inst)
          wheel="$(ls -t native/target/wheels-inst/mm_core-*-cp312-abi3-*aarch64.whl | head -1)"
          python - "$wheel" "$RUNNER_TEMP/pgo-inst/mm_core.abi3.so" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = [n for n in zf.namelist() if n.endswith("mm_core.abi3.so")]
              assert len(names) == 1, names
              with zf.open(names[0]) as src, open(sys.argv[2], "wb") as dst:
                  dst.write(src.read())
          PY
      - name: Train the instrumented core (watch for SIGSEGV at profile write)
        run: |
          set -euo pipefail
          LLVM_PROFILE_FILE="$RUNNER_TEMP/pgo-prof/default_%m.profraw" \
            python scripts/pgo/train.py --lib-dir "$RUNNER_TEMP/pgo-inst" \
            --workdir "$RUNNER_TEMP/pgo-work" --json-out "$RUNNER_TEMP/pgo-train.json"
          ls -la "$RUNNER_TEMP/pgo-prof"
      - name: Merge profiles (llvm-profdata)
        run: |
          set -euo pipefail
          LLVM_BIN="$(rustc --print sysroot)/lib/rustlib/aarch64-apple-darwin/bin"
          "$LLVM_BIN/llvm-profdata" merge -o "$RUNNER_TEMP/pgo-prof/merged.profdata" "$RUNNER_TEMP/pgo-prof"
          "$LLVM_BIN/llvm-profdata" show "$RUNNER_TEMP/pgo-prof/merged.profdata" | tee "$RUNNER_TEMP/pgo-prof/show.txt"
      - name: Build the PGO arm64-only artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ab/pgo"
          (cd native && MM_CORE_COMMIT="$(git rev-parse --short=9 HEAD 2>/dev/null || echo dev)" \
            RUSTFLAGS="-Cprofile-use=$RUNNER_TEMP/pgo-prof/merged.profdata -Cllvm-args=-pgo-warn-missing-function" \
            maturin build --release --target aarch64-apple-darwin --out target/wheels-pgo)
          wheel="$(ls -t native/target/wheels-pgo/mm_core-*-cp312-abi3-*aarch64.whl | head -1)"
          python - "$wheel" "$RUNNER_TEMP/ab/pgo/mm_core.abi3.so" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = [n for n in zf.namelist() if n.endswith("mm_core.abi3.so")]
              assert len(names) == 1, names
              with zf.open(names[0]) as src, open(sys.argv[2], "wb") as dst:
                  dst.write(src.read())
          PY
      - name: A/B measure (arm64-only baseline vs PGO)
        run: |
          set -euo pipefail
          python scripts/pgo/train.py --measure \
            --a "$RUNNER_TEMP/ab/baseline" --b "$RUNNER_TEMP/ab/pgo" \
            --rounds 5 --workdir "$RUNNER_TEMP/probe-macos-work" --json-out "$RUNNER_TEMP/probe-macos-arm64.json" \
            | tee "$RUNNER_TEMP/probe-macos-arm64.log"
      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-macos-arm64-pgo
          retention-days: 1
          path: |
            ${{ runner.temp }}/probe-macos-arm64.json
            ${{ runner.temp }}/probe-macos-arm64.log
            ${{ runner.temp }}/pgo-train.json

  probe-cold-build:
    # From-scratch zigbuild of the shipping artifact with NO caches anywhere.
    # The wall time is the cold-build datapoint for the cache policy
    # question (the workflow's rust-cache saves with save-if).
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[optimization-probe]')
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable # floating branch by policy; see .github/zizmor.yml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install cross toolchain (pinned)
        env:
          UV_MALWARE_CHECK: "1"
        run: uv pip install --system cargo-zigbuild==0.23.4 ziglang==0.16.0
      - name: Cold zigbuild timing (no caches)
        run: |
          set -euo pipefail
          start=$(date +%s)
          ./scripts/build-native.sh --target linux-x86_64 --size-gate
          end=$(date +%s)
          echo "cold zigbuild wall time: $((end - start)) s" | tee "$RUNNER_TEMP/probe-cold-build.log"
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-cold-build
          retention-days: 1
          path: ${{ runner.temp }}/probe-cold-build.log
