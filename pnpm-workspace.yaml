allowBuilds:
  esbuild: true
  vue-demi: true
  unrs-resolver: true

overrides:
  # @comfyorg/comfyui-desktop-bridge-types override removed 2026-09-30:
  # comfyui-frontend-types 1.54.9 now depends on desktop-bridge-types 0.2.0
  # directly, so forcing it was redundant (fallow flagged it as dead-code).
  # TypeScript 7 is excluded project-wide (peripheral-tool readiness — 2026-09-29
  # user decision). fallow-type-aware's open `typescript` range would otherwise
  # re-resolve to 7.x on update; pin the whole tree to the 6.x toolchain.
  typescript: "6.0.3"
