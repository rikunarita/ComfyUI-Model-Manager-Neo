[project]
name = "comfyui-model-manager-neo"
description = "Manage models: browsing, download and delete. Fork of ComfyUI-Model-Manager with improved HF/Civitai auth, huggingface_hub integration, and bug fixes."
version = "0.3.2"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "markdownify>=0.14.0",
    "huggingface_hub>=1.32.0",
    "hf_xet>=1.5.2,<2.0.0",
    "modelscope_hub>=0.4.3",
]

[project.urls]
Repository = "https://github.com/rikunarita/ComfyUI-Model-Manager-Neo"

[tool.comfy]
PublisherId = "rikunarita7669"
DisplayName = "ComfyUI-Model-Manager-Neo"
Icon = ""

# ---------------------------------------------------------------------------
# uv: Python package management for the DEVELOPMENT and CI layers only
# (Phase 7 T4 - a pip replacement). The runtime contract is unchanged:
# requirements.txt (read by ComfyUI / ComfyUI-Manager) and __init__.py ->
# utils.pip_install run inside the USER's ComfyUI Python, where uv cannot be
# assumed. The frontend (pnpm) is entirely out of scope for uv.
#
# The root project is VIRTUAL (no [build-system]): `package = false` tells uv
# to install dependencies without building/installing the project itself.
# uv.lock (committed) pins the resolved versions for cross-platform
# reproducibility - `uv sync --frozen` rebuilds the whole dev/test environment
# in one shot. requirements.txt stays the runtime source
# of truth; the lock is generated from this pyproject (one-way).
# ---------------------------------------------------------------------------
[tool.uv]
package = false

# torch's CPU wheels are ~200 MB lighter than the default CUDA build; the
# EXPLICIT index keeps ONLY torch on the CPU wheelhouse (T4). Every other
# package still resolves from the default index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# PEP 735 dependency group: the dev/test/build toolchain plus the two runtime
# deps ComfyUI itself provides (pillow, aiohttp) so the suite runs standalone.
# The runtime hub deps are listed for a self-contained dev environment (uv
# resolves them together with [project].dependencies). ruff is pinned to match
# CI (T3).
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "torch",
    "numpy",
    "safetensors",
    "maturin",
    "ruff==0.16.9",
    "mypy",
    "markdownify>=0.14.0",
    "huggingface_hub>=1.32.0",
    "hf_xet>=1.5.2,<2.0.0",
    "modelscope_hub>=0.4.3",
    "pillow",
    "aiohttp",
    "pyyaml",
]

# ---------------------------------------------------------------------------
# mypy: static types for the Python backend (Phase 7 T5 - the former
# mypy.ini, mechanically converted; mypy >= 1.x auto-discovers `[tool.mypy]`
# in pyproject.toml, verified on mypy 2.3.1).
#
# The extension directory name contains a dash, so mypy cannot treat it as a
# package; the backend modules are checked file-wise instead (`files` below).
# `check_untyped_defs` catches real defects inside bodies even where signatures
# are still loose; `disallow_untyped_defs` is left off deliberately - annotating
# ~3k lines of aiohttp handlers is a dedicated follow-up, not part of this pass.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = [
    "py/utils.py",
    "py/auth.py",
    "py/config.py",
    "py/thread.py",
    "py/native.py",
    "py/manager.py",
    "py/download.py",
    "py/upload.py",
    "py/upload_hf.py",
    "py/upload_modelscope.py",
    "py/information.py",
    "py/compress.py",
    "py/search.py",
    "py/identify.py",
    "py/http_client.py",
    "py/watcher.py",
]
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."
namespace_packages = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# ---------------------------------------------------------------------------
# Ruff: lint + format for the Python backend (`py/`, `__init__.py`).
# The rule set is curated, not maximal: correctness families (pyflakes,
# bugbear, pyupgrade, comprehensions, returns, Ruff's own async/dict checks)
# plus import sorting; two families are consciously ignored (see below).
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312" # Python floor: the abi3-py312 native core (3.10 hit EOL 2026-10-01)
line-length = 120
extend-exclude = ["web", "downloads", "demo"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RET", "RUF", "PIE", "S"]
ignore = [
    # The ComfyUI entry point mutates `folder_paths.supported_pt_extensions`
    # BEFORE importing the extension modules, and heavy deps (PIL, zipnn)
    # are deliberately imported mid-file / lazily: import order is semantic.
    "E402",
    # The defensive `try: ... except Exception: pass` guards around optional
    # reporting read clearer here than contextlib.suppress blocks.
    "SIM105",
    # S110/S112 are the flake8-bandit view of the SAME documented stance as
    # SIM105 above: optional reporting/cleanup paths deliberately swallow
    # exceptions silently so a failing side-channel can never take the
    # extension (or ComfyUI) down with it. The pickle/subprocess/url-open
    # families stay ENABLED and are triaged per site with reasoned noqa
    # comments.
    "S110",
    "S112",
]

[tool.ruff.lint.per-file-ignores]
# pytest asserts ARE the test idiom (S101); the auth-store fixtures pass
# literal `password=`/`token=` arguments by nature of what they test (S106);
# /tmp scratch paths in tests are sandboxed by pytest's tmp fixtures or
# deliberate (S108).
"tests/*" = ["S101", "S106", "S108"]
# The PGO training harness and the L5 official-zipnn cross-validation gate
# are plain-stdlib scripts whose in-run verification mechanism IS `assert`
# (no pytest on those paths — train.py must stay stdlib-only by design).
"scripts/pgo/*" = ["S101"]
"scripts/l5/*" = ["S101"]

[tool.ruff.format]
docstring-code-format = false
