# リンカー方針（2026-10-01 決定）:
#
# Linux ネイティブビルドは **rustc 同梱の rust-lld（既定）** を使用する。
# Rust 1.90 以降、x86_64-unknown-linux-gnu は rust-lld が既定リンカーであり、
# このファイルで明示指定していた旧 mold 設定（linker = "clang" +
# -C link-arg=-fuse-ld=mold）は撤去した — 成果物のリンク速度に実差はなく
# （4 MB 級 cdylib のリンクは fat-LTO のコード生成に埋没する）、代わりに
# CI とローカル双方から clang/mold の外部依存が消える（native.yml の
# apt ステップは 2026-09-30 にミラーストールで 6 時間ハングし run 全体を
# cancelled にした前例がある = 障害面の削減が主目的）。
#
# - aarch64-unknown-linux-gnu は rust-lld が既定化されていないため、
#   ネイティブ開発ビルドはシステム既定リンカーに任せる（必要なら各自
#   `-C linker-features=+lld`）。配布成果物は zigbuild 経路なので影響なし。
# - クロスビルド（cargo-zigbuild）は zig 側リンカー（LLD）が使用され、
#   CARGO_TARGET_*_LINKER 環境変数でこの種の設定を上書きする（glibc 2.28
#   の床も zig が決定する）。macOS は ld-prime、Windows は link.exe（MSVC）。
# - fuzz（nightly・別ワークスペース）も cargo の config 探索でこのディレクトリ
#   を拾うが、target 節が無いため nightly 既定の rust-lld が使われる
#   （ASan ランタイムは rustc が compiler-rt を同梱するためリンカー非依存）。
