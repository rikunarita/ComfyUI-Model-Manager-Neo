# Rust native core workspace.
#
# Layout:
#   crates/znn-codec   pure-Rust ZipNN codec (no Python dependency)
#   crates/mm-core     PyO3 extension module `mm_core` (abi3-py312 —
#                      floor raised from abi3-py310;
#                      CPython 3.10 hit EOL 2026-10-01 and 3.12 is ComfyUI's
#                      documented support floor)
#
# Release profile: `panic = "unwind"` is REQUIRED (PyO3 catches panics at the
# boundary and turns them into Python exceptions; `abort` would kill the whole
# ComfyUI process). Size budget: <= 5 MB per binary with
# lto = "fat" + codegen-units = 1 + strip.

[workspace]
resolver = "2"
members = ["crates/mm-core", "crates/znn-codec"]
# The cargo-fuzz crate is its own (nightly) workspace — keep it out of the
# stable workspace (different toolchain + sanitizer flags).
exclude = ["crates/znn-codec/fuzz"]

[workspace.package]
version = "0.4.0"
edition = "2024"
# edition 2024 requires >= 1.85; PyO3's own MSRV is 1.83 (see clippy.toml).
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/rikunarita/ComfyUI-Model-Manager-Neo"

[workspace.dependencies]
# NOTE: `extension-module` must NOT be enabled here — mm-core exposes it as
# its own DEFAULT feature so `cargo test -p mm-core --no-default-features`
# genuinely links the test harness against libpython (the CI/README-documented
# behaviour). A workspace-level `features = ["extension-module", ...]` would
# be inherited unconditionally by `pyo3 = { workspace = true }` and the crate
# toggle could never turn it off (verified with `cargo tree -e features`).
#
# No `abi3*` features here either — the former
# workspace-pinned `abi3-py310` moved into mm-core's own `stable-abi` feature
# (now `abi3-py312`). The stable-ABI flavour must stay EXCLUSIVELY owned by
# mm-core's feature axes (`stable-abi` = abi3-py312 for GIL builds, `ft` =
# abi3t-py315 for free-threaded 3.15+, Step 2): enabling `abi3` and `abi3t`
# together makes the produced flavour host-dependent (abi3 below a 3.15 host,
# abi3t at/above it — PyO3 building-and-distribution guide), which a workspace
# pin would silently do for every build mode. The native-test toggle gate
# verifies the exclusivity from `cargo metadata` on every run.
pyo3 = { version = "0.29.2" }

# Phase 1 (znn-codec format core) — versions re-verified against the
# crates.io API on 2026-09-23:
rayon = "1.12.0"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Phase 2 (safetensors I/O + compression pipeline):
# jiter   borrowed non-destructive JSON parse of mmap'd headers (Phase 0
#         decision: 17.7x faster than simd-json on the 8 MB MoE fixture,
#         the only candidate satisfying the read-only-mmap requirement)
# memmap2 zero-copy source reads
# sha2    end-to-end integrity verification (runtime-detected
#         SHA-NI/AVX2 backends)
jiter = "0.17.0"
memmap2 = "0.9.11"
sha2 = "0.11.0"
# Phase 3 (batch walk primitives) — first candidate for the
# parallel walk (Phase 5 benches it against dua-core for scan_models).
ignore = "0.4.33"

# Phase 5 (scan / index / hash / header — versions
# re-verified against the crates.io API on 2026-09-27):
#   bincode  2.0.1 — persistent-index snapshot. NOTE: crates.io reports
#          `max_stable_version = 3.0.0`, but that release is a compile_error!
#          placeholder (xkcd 2347 dependency-confusion squat guard; verified by
#          extracting the .crate — its whole lib.rs is `compile_error!(...)`).
#          2.0.1 (70 KB, 2025-03-10) is the real latest stable.
#   blake3   1.8.7 — index checksum + the BLAKE3 notation of `hash_file`
#          (rayon feature = parallel tree hashing of large files).
#   crc32fast 1.5.2 — the CRC32 notation (Civitai's byte-swapped hex).
#   yaml-rust2 0.13.0 — the notes front-matter subset the scan parses
#          (serde_yaml is deprecated).
bincode = { version = "2.0.1", features = ["derive"] }
blake3 = { version = "1.8.7", features = ["rayon"] }
crc32fast = "1.5.2"
yaml-rust2 = "0.13.0"
# Phase 6 (file-watching): `notify` +
# `notify-debouncer-full` DIRECTLY — the `extended-notify` wrapper is not used
# (0.1.x, single author, pulls tokio into the shipped binary, pins
# debouncer-full a generation back). Versions
# re-verified against the crates.io API on 2026-09-27 (max_stable_version).
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

# Phase 7 (T7 — プレビュー WebP パイプライン): zenwebp は純 Rust の
# WebP codec（lossy VP8 + lossless VP8L の encode/decode・alpha・animation・
# ICC/EXIF/XMP）。imazen（Imageflow 開発元）。**AGPL-3.0-only OR
# LicenseRef-Imazen-Commercial** のデュアルライセンス — 本拡張は GPL-3.0-only なので
# **AGPL-3.0 条件で組み込む**（AGPLv3 §13 が GPLv3 成果物との結合を明示許可・
# native/NOTICE + README Credits に帰属表示）。version は crates.io API で
# 2026-09-29 再確認（0.4.5 は yanked・0.4.4 = max_stable_version）。
zenwebp = "0.4.4"

# Test / bench support
proptest = "1.11.0"
tempfile = "3.27.0"

# Shared lint policy: pedantic = warn (CI runs clippy with
# `-D warnings`, so it is effectively deny there), unsafe lints = deny, and
# any future `unsafe` block requires a `// SAFETY:` comment (review rule).
[workspace.lints.rust]
unsafe_code = "deny"
# Denied here (and warn-by-default under edition 2024 anyway). NOTE: on the
# current toolchain (1.98) this is a *rustc* lint — the former
# `clippy::unsafe_op_in_unsafe_fn` spelling is rejected as an unknown lint.
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
panic = "unwind"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
