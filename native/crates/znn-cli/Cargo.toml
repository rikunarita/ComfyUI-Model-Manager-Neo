[package]
name = "znn-cli"
description = "Developer CLI for znn-codec: ZipNN-core-equivalent compress/decompress (C ABI mirror), batch mode for the L2 golden-diff harness, and (Phase 3+) delta tooling. Never distributed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "znn-cli"
path = "src/main.rs"

[dependencies]
znn-codec = { path = "../znn-codec" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
