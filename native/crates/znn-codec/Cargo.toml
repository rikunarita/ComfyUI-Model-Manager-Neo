[package]
name = "znn-codec"
description = "Pure-Rust ZipNN codec: ZN header, bit reorder, plane split, huff0/FSE, delta, safetensors I/O, scan and multi-algorithm hashing. No Python dependency (Plan §3.6/§4.5). Phase 1: format core (header/planes/huff0/FSE/codec)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = { workspace = true }
rayon = { workspace = true }
# Phase 2: safetensors container I/O + the integrity pipeline (Plan §3.7).
jiter = { workspace = true }
memmap2 = { workspace = true }
sha2 = { workspace = true }
# Phase 3: the parallel directory walk behind `walk_models` (batch
# primitives — Plan §3.7 "並列 walk ignore 第一候補").
ignore = { workspace = true }
# Phase 5 (Plan §3.7 catalog, §4.7): the library scan (front-matter YAML +
# JSON wire shape), the persistent index (bincode snapshot + blake3 checksum)
# and the multi-algorithm hash pass (sha2 + blake3 + crc32fast).
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
blake3 = { workspace = true }
crc32fast = { workspace = true }
yaml-rust2 = { workspace = true }
# Phase 6 (Plan §4.7.2-2 `watch_roots`): optional so a consumer that never
# watches does not pay for the notify dependency tree. mm-core enables it by
# default (the shipped binaries must expose `mm_core.watch_*`; the RUNTIME
# switch is the default-OFF ComfyUI setting).
notify = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
# delta tests parse the `.neo-delta.json` sidecar with a real JSON reader
serde_json = { workspace = true }
tempfile = { workspace = true }

[features]
# `watch` is default-ON: the prebuilt binaries under `native/native-bin/` are
# what a stock install loads, so an opt-in feature would ship a `watch_roots`
# setting that can never work. The feature stays toggleable for consumers of
# the codec crate that do not want the notify dependency tree.
default = ["watch"]
# Plan §4.7.2-2 `watch_roots` (notify + notify-debouncer-full directly —
# extended-notify is NOT used, Plan §3.1).
watch = ["dep:notify", "dep:notify-debouncer-full"]
