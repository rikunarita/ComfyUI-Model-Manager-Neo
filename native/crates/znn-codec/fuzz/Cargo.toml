[package]
name = "znn-codec-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.znn-codec]
path = ".."

# Own workspace root — the fuzz crate must never join the parent workspace
# (different toolchain: nightly + sanitizers). The parent workspace also
# lists this directory in its `exclude`.
[workspace]

[[bin]]
name = "huf_decompress"
path = "fuzz_targets/huf_decompress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zn_header"
path = "fuzz_targets/zn_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_decompress"
path = "fuzz_targets/codec_decompress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "st_parse"
path = "fuzz_targets/st_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blob_decompress"
path = "fuzz_targets/blob_decompress.rs"
test = false
doc = false
bench = false
