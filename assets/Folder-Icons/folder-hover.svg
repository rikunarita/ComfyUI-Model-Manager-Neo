<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 1024 768"
  width="1024"
  height="768"
  fill="none"
>
  <title>Folder hover state - turquoise sparkles rise above the flat-aurora glass folder</title>

  <defs>
    <!-- ============ GRADIENTS (two stops only) ============ -->
    <linearGradient id="e1-body" x1="230" y1="210" x2="700" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFF2EA"/>
      <stop offset="1" stop-color="#4FB6D9"/>
    </linearGradient>

    <linearGradient id="e1-tint" x1="0" y1="330" x2="0" y2="606" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>

    <!-- ============ FILTERS (single soft ground shadow only) ============ -->
    <filter id="e1-blurM" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- ============ GEOMETRY ============ -->
    <path id="e1-bodyPath" d="
      M204 254
      C204 224 228 200 258 200
      H384
      C402 200 419 207 432 220
      L466 254
      C472 260 480 263 488 263
      H692
      C724 263 750 289 750 321
      V548
      C750 580 724 606 692 606
      H262
      C230 606 204 580 204 548
      Z"/>

    <rect id="e1-glassPath" x="204" y="330" width="546" height="276" rx="46"/>
    <rect id="e1-glassInner" x="214" y="340" width="526" height="256" rx="37"/>

    <clipPath id="e1-bodyClip"><use xlink:href="#e1-bodyPath" href="#e1-bodyPath"/></clipPath>
    <clipPath id="e1-glassClip"><use xlink:href="#e1-glassPath" href="#e1-glassPath"/></clipPath>
    <clipPath id="e1-gapClip"><rect x="0" y="0" width="1024" height="330"/></clipPath>

    <!-- flat solid file sheets -->
    <g id="e1-sheets">
      <g transform="rotate(-5 360 400)">
        <rect x="292" y="272" width="150" height="240" rx="20" fill="#FFFFFF" opacity="0.95"/>
        <rect x="312" y="304" width="110" height="13" rx="6.5" fill="#1FA5AC" opacity="0.25"/>
        <rect x="312" y="330" width="80" height="13" rx="6.5" fill="#1FA5AC" opacity="0.16"/>
      </g>
      <g transform="rotate(3 480 390)">
        <rect x="408" y="266" width="150" height="240" rx="20" fill="#E4FAF5" opacity="0.95"/>
        <rect x="428" y="298" width="110" height="13" rx="6.5" fill="#2AB0B6" opacity="0.23"/>
        <rect x="428" y="324" width="66" height="13" rx="6.5" fill="#2AB0B6" opacity="0.15"/>
      </g>
      <g transform="rotate(-2 610 400)">
        <rect x="536" y="278" width="150" height="240" rx="20" fill="#C9F0F4" opacity="0.95"/>
        <rect x="556" y="310" width="110" height="13" rx="6.5" fill="#2196AC" opacity="0.21"/>
        <rect x="556" y="336" width="88" height="13" rx="6.5" fill="#2196AC" opacity="0.14"/>
      </g>
    </g>
  </defs>

  <!-- ============ GROUND SHADOW (single soft pool) ============ -->
  <ellipse cx="496" cy="618" rx="272" ry="30" fill="#177F92" opacity="0.16" filter="url(#e1-blurM)"/>

  <!-- ============ FOLDER BODY ============ -->
  <use xlink:href="#e1-bodyPath" href="#e1-bodyPath" fill="url(#e1-body)"/>
  <path d="M262 228 H384 C398 228 410 233 420 243 L452 275 C458 281 466 284 474 284 H676"
    stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.80"/>

  <!-- ============ FILE SHEETS (sharp in the gap) ============ -->
  <g clip-path="url(#e1-bodyClip)">
    <g clip-path="url(#e1-gapClip)">
      <use xlink:href="#e1-sheets" href="#e1-sheets"/>
    </g>
  </g>

  <!-- ============ FLAT GLASS BAND (crisp translucency, no blur) ============ -->
  <g clip-path="url(#e1-glassClip)">
    <use xlink:href="#e1-sheets" href="#e1-sheets" opacity="0.45"/>
    <use xlink:href="#e1-glassPath" href="#e1-glassPath" fill="url(#e1-tint)"/>
    <!-- single hard-edged sheen -->
    <path d="M356 330 L306 606 H352 L402 330 Z" fill="#FFFFFF" opacity="0.12"/>
    <use xlink:href="#e1-glassInner" href="#e1-glassInner" stroke="#FFFFFF" stroke-width="2" opacity="0.30"/>
  </g>
  <use xlink:href="#e1-glassPath" href="#e1-glassPath" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4" stroke-linejoin="round"/>
  <use xlink:href="#e1-glassPath" href="#e1-glassPath" stroke="#35C8E8" stroke-width="1.5" opacity="0.40" stroke-linejoin="round"/>
  <!-- ============ SPARKLES (hover state only, flat solid) ============ -->
  <g fill="#1FA5AC">
    <path d="M560 148 c4 16.2 8.5 20.8 25 25 c-16.5 4.2 -21 8.8 -25 25 c-4 -16.2 -8.5 -20.8 -25 -25 c16.5 -4.2 21 -8.8 25 -25 Z" opacity="0.90"/>
    <path d="M648 118 c2.8 11.4 6 14.6 17.6 17.6 c-11.6 3 -14.8 6.2 -17.6 17.6 c-2.8 -11.4 -6 -14.6 -17.6 -17.6 c11.6 -3 14.8 -6.2 17.6 -17.6 Z" opacity="0.70"/>
    <path d="M700 186 c2 8.2 4.3 10.5 12.6 12.6 c-8.3 2.1 -10.6 4.4 -12.6 12.6 c-2 -8.2 -4.3 -10.5 -12.6 -12.6 c8.3 -2.1 10.6 -4.4 12.6 -12.6 Z" opacity="0.55"/>
  </g>
</svg>
