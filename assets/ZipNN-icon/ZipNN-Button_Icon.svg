<svg width="512" height="512" viewBox="58 58 396 396"
     xmlns="http://www.w3.org/2000/svg">
  <!--
    FRAMING / 枠合わせメモ  (TIGHT + 強めの影 = 採用版)

    viewBox : 58 58 396 396  (1:1)
    panel   : 68,68 to 444,444 (376x376, rx96)
    scale   : 512 / 396 = 1.2929
    margin  : (68-58) * 1.2929 = 12.93px  = 上下左右すべて均等 約13px
    stroke  : 2.5 * 1.2929 = 3.2px（外端は panel 境界ちょうど＝カット無し）

    shadow  : 88,98 336x320 / rx92 / blur 10 / opacity .9
              パネルと同芯(x中心256)で y のみ +10 の落ち影。
              実効 bbox = x 58..454 / y 68..446
                -> 左右は枠ちょうど(はみ出し 0)、上は 10 user の余裕、
                   下端は枠の 8 user 手前で収束 = カット線なし。
              さらに mask(#shadowFade) で y412..452 を alpha 0 へフェード。
              影の可視部はパネル背後に隠れるため、強い blur でも
              「ガラスが浮いている」輪郭のにじみとして効く。

    影をもっと弱くしたい場合 : stdDeviation 10 -> 6、rect を 82,92 348x348 に
    余白を 20px にしたい場合 : viewBox="52 52 408 408" + rect 74,80 364x364 / blur 12
  -->

  <style>
    :root {
      --glass-1: rgba(255,255,255,.62);
      --glass-2: rgba(220,235,255,.24);
      --glass-stroke: rgba(255,255,255,.78);

      --text: #17233d;
      --text-soft: #52658c;

      --accent-1: #61c8ff;
      --accent-2: #718bff;
      --accent-3: #a46dff;

      --node: #f8fbff;
      --shadow: rgba(48,76,130,.25);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --glass-1: rgba(40,52,82,.58);
        --glass-2: rgba(20,30,55,.34);
        --glass-stroke: rgba(190,215,255,.28);

        --text: #f4f7ff;
        --text-soft: #9eafd0;

        --accent-1: #59d3ff;
        --accent-2: #718cff;
        --accent-3: #b178ff;

        --node: #eef5ff;
        --shadow: rgba(0,0,0,.58);
      }
    }
  </style>

  <defs>

    <!-- Glass -->
    <linearGradient id="glass"
                    x1="105" y1="70"
                    x2="410" y2="442"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--glass-1)"/>
      <stop offset=".5" stop-color="var(--glass-2)"/>
      <stop offset="1" stop-color="var(--glass-2)"/>
    </linearGradient>

    <!-- Accent (zip symbol) -->
    <linearGradient id="accent"
                    x1="160" y1="150"
                    x2="360" y2="360"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--accent-1)"/>
      <stop offset=".5" stop-color="var(--accent-2)"/>
      <stop offset="1" stop-color="var(--accent-3)"/>
    </linearGradient>

    <!-- Network: horizontal blue → purple sweep -->
    <linearGradient id="net"
                    x1="181" y1="245"
                    x2="335" y2="245"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--accent-1)"/>
      <stop offset=".5" stop-color="var(--accent-2)"/>
      <stop offset="1" stop-color="var(--accent-3)"/>
    </linearGradient>

    <!-- Wordmark -->
    <linearGradient id="wordmark"
                    x1="180" y1="365"
                    x2="337" y2="365"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--accent-1)"/>
      <stop offset=".55" stop-color="var(--accent-2)"/>
      <stop offset="1" stop-color="var(--accent-3)"/>
    </linearGradient>

    <!-- Shadow: 浮遊感を出す強め(σ10)。枠外へはみ出さない寸法に調整済み -->
    <filter id="shadow"
            x="-40%" y="-40%"
            width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Blur -->
    <filter id="blur"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <!-- Glow -->
    <filter id="glow"
            x="-70%" y="-70%"
            width="240%" height="240%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- Small glow -->
    <filter id="smallGlow"
            x="-100%" y="-100%"
            width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- Glass clipping -->
    <clipPath id="panelClip">
      <rect x="68" y="68"
            width="376" height="376"
            rx="96"/>
    </clipPath>

    <!-- 影の下端フェード: 枠(512^2)の縁で直線的にカットされないようにする -->
    <linearGradient id="shadowFadeGrad"
                    x1="0" y1="68"
                    x2="0" y2="452"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#fff"/>
      <stop offset=".86" stop-color="#fff"/>
      <stop offset="1"   stop-color="#000"/>
    </linearGradient>

    <mask id="shadowFade"
          maskUnits="userSpaceOnUse"
          x="58" y="58" width="396" height="396">
      <rect x="58" y="58"
            width="396" height="396"
            fill="url(#shadowFadeGrad)"/>
    </mask>

  </defs>


  <!-- =========================================================
       GLASS PANEL
       外側には背景・枠線を描画しない
       ========================================================= -->

  <!-- Glass shadow（パネルと同芯・y のみ +10 の落ち影 / 下端はマスクでフェード） -->
  <rect x="88" y="98"
        width="336"
        height="320"
        rx="92"
        fill="var(--shadow)"
        opacity=".9"
        filter="url(#shadow)"
        mask="url(#shadowFade)"/>

  <!-- Main glass -->
  <rect x="68" y="68"
        width="376" height="376"
        rx="96"
        fill="url(#glass)"
        stroke="var(--glass-stroke)"
        stroke-width="2.5"/>


  <!-- =========================================================
       GLASS REFLECTION
       ========================================================= -->

  <path d="
    M136 78
    H376
    C407 78 432 103 432 134
    V163
    C383 126 325 104 260 94
    C213 87 169 86 119 98
    C123 89 128 82 136 78Z"
    fill="white"
    opacity=".12"
    clip-path="url(#panelClip)"/>


  <!-- Central ambient glow -->
  <circle cx="256"
          cy="245"
          r="108"
          fill="var(--accent-2)"
          opacity=".08"
          filter="url(#blur)"/>


  <!-- =========================================================
       INCOMING DATA
       ========================================================= -->

  <g opacity=".7">

    <rect x="105" y="187.5"
          width="44" height="7"
          rx="3.5"
          fill="var(--text-soft)"
          opacity=".6"/>

    <rect x="105" y="214.5"
          width="30" height="7"
          rx="3.5"
          fill="var(--text-soft)"
          opacity=".38"/>

    <rect x="105" y="241.5"
          width="52" height="7"
          rx="3.5"
          fill="var(--text-soft)"
          opacity=".55"/>

    <rect x="105" y="268.5"
          width="37" height="7"
          rx="3.5"
          fill="var(--text-soft)"
          opacity=".35"/>

    <rect x="105" y="295.5"
          width="47" height="7"
          rx="3.5"
          fill="var(--text-soft)"
          opacity=".52"/>

  </g>


  <!-- =========================================================
       OUTGOING COMPRESSED DATA
       ========================================================= -->

  <g opacity=".72">

    <rect x="366" y="207.5"
          width="38" height="7"
          rx="3.5"
          fill="var(--text-soft)"
          opacity=".55"/>

    <rect x="377" y="230"
          width="27" height="7"
          rx="3.5"
          fill="var(--text-soft)"
          opacity=".35"/>

    <rect x="359" y="253"
          width="45" height="7"
          rx="3.5"
          fill="var(--text-soft)"
          opacity=".52"/>

    <rect x="373" y="275.5"
          width="31" height="7"
          rx="3.5"
          fill="var(--text-soft)"
          opacity=".36"/>

  </g>


  <!-- =========================================================
       NEURAL NETWORK GLOW
       ========================================================= -->

  <g stroke="url(#net)"
     stroke-width="13"
     stroke-linecap="round"
     opacity=".16"
     filter="url(#glow)">

    <!-- Input → Bundle -->
    <path d="M185 195 L233 217"/>
    <path d="M185 245 L233 245"/>
    <path d="M185 295 L233 273"/>

    <!-- Bundle → Hidden -->
    <path d="M233 217 L277 204"/>
    <path d="M233 217 L277 245"/>
    <path d="M233 245 L277 204"/>
    <path d="M233 245 L277 245"/>
    <path d="M233 245 L277 286"/>
    <path d="M233 273 L277 245"/>
    <path d="M233 273 L277 286"/>

    <!-- Hidden → Output -->
    <path d="M277 204 L331 225"/>
    <path d="M277 245 L331 225"/>
    <path d="M277 245 L331 265"/>
    <path d="M277 286 L331 265"/>

  </g>


  <!-- =========================================================
       NEURAL NETWORK CONNECTIONS
       太めのエッジで「束ねられていく」圧縮感を表現
       ========================================================= -->

  <g stroke="url(#net)"
     stroke-width="7"
     stroke-linecap="round"
     stroke-linejoin="round"
     opacity=".92">

    <!-- Input → Bundle (1:1 に収束) -->
    <path d="M185 195 L233 217"/>
    <path d="M185 245 L233 245"/>
    <path d="M185 295 L233 273"/>

    <!-- Bundle → Hidden (密な結合) -->
    <path d="M233 217 L277 204"/>
    <path d="M233 217 L277 245"/>
    <path d="M233 245 L277 204"/>
    <path d="M233 245 L277 245"/>
    <path d="M233 245 L277 286"/>
    <path d="M233 273 L277 245"/>
    <path d="M233 273 L277 286"/>

    <!-- Hidden → Output -->
    <path d="M277 204 L331 225"/>
    <path d="M277 245 L331 225"/>
    <path d="M277 245 L331 265"/>
    <path d="M277 286 L331 265"/>

  </g>


  <!-- =========================================================
       NEURAL NETWORK NODES
       淡いフィル + 太いグラデーションリング
       ========================================================= -->

  <g fill="var(--node)"
     stroke="url(#net)"
     stroke-width="5">

    <!-- Input -->
    <circle cx="185" cy="195" r="11"/>
    <circle cx="185" cy="245" r="11"/>
    <circle cx="185" cy="295" r="11"/>

    <!-- Compression bundle (狭intervalに束ねる) -->
    <circle cx="233" cy="217" r="10"/>
    <circle cx="233" cy="245" r="10"/>
    <circle cx="233" cy="273" r="10"/>

    <!-- Hidden (central hub) -->
    <circle cx="277" cy="204" r="11.5"/>
    <circle cx="277" cy="245" r="14"/>
    <circle cx="277" cy="286" r="11.5"/>

    <!-- Output -->
    <circle cx="331" cy="225" r="12"/>
    <circle cx="331" cy="265" r="12"/>

  </g>


  <!-- Node highlights -->
  <g fill="white" opacity=".8">

    <circle cx="181.5" cy="191.5" r="2.6"/>
    <circle cx="230" cy="214" r="2.4"/>
    <circle cx="273" cy="241" r="3"/>
    <circle cx="327.5" cy="221.5" r="2.6"/>

  </g>


  <!-- =========================================================
       ZIP / COMPRESSION SYMBOL
       ========================================================= -->

  <g transform="translate(323 126)">

    <!-- Glow -->
    <rect x="0" y="0"
          width="58"
          height="58"
          rx="18"
          fill="url(#accent)"
          opacity=".16"
          filter="url(#glow)"/>

    <!-- Glass capsule -->
    <rect x="0" y="0"
          width="58"
          height="58"
          rx="18"
          fill="white"
          fill-opacity=".08"
          stroke="white"
          stroke-opacity=".32"
          stroke-width="1.5"/>

    <!-- Zipper spine -->
    <path d="M29 10 V38"
          stroke="url(#accent)"
          stroke-width="4"
          stroke-linecap="round"/>

    <!-- Zipper teeth -->
    <g fill="white" opacity=".92">

      <rect x="11" y="12"
            width="13" height="5.5"
            rx="2.75"/>

      <rect x="34" y="12"
            width="13" height="5.5"
            rx="2.75"/>

      <rect x="11" y="22.5"
            width="13" height="5.5"
            rx="2.75"/>

      <rect x="34" y="22.5"
            width="13" height="5.5"
            rx="2.75"/>

      <rect x="11" y="33"
            width="13" height="5.5"
            rx="2.75"/>

      <rect x="34" y="33"
            width="13" height="5.5"
            rx="2.75"/>

    </g>

    <!-- Puller -->
    <rect x="24" y="37"
          width="10" height="13"
          rx="4"
          fill="url(#accent)"/>
    <circle cx="29"
            cy="43.5"
            r="2"
            fill="white"
            opacity=".95"/>

  </g>


  <!-- =========================================================
       ZIPNN WORDMARK
       ========================================================= -->

  <!-- Separator -->
  <path d="M154 341 H358"
        stroke="var(--text-soft)"
        stroke-width="1"
        opacity=".18"/>


  <!-- Wordmark glow -->
  <text x="256"
        y="383"
        text-anchor="middle"
        font-family="Inter, SF Pro Display, Segoe UI, sans-serif"
        font-size="43"
        font-weight="700"
        letter-spacing="-1.5"
        fill="url(#wordmark)"
        opacity=".22"
        filter="url(#smallGlow)">
    ZipNN
  </text>


  <!-- Actual wordmark -->
  <text x="256"
        y="383"
        text-anchor="middle"
        font-family="Inter, SF Pro Display, Segoe UI, sans-serif"
        font-size="43"
        font-weight="700"
        letter-spacing="-1.5"
        fill="url(#wordmark)">
    ZipNN
  </text>


  <!-- =========================================================
       LOWER TECHNICAL ACCENT
       ========================================================= -->

  <g opacity=".5">

    <circle cx="234" cy="405" r="4" fill="var(--accent-1)"/>

    <rect x="246" y="401"
          width="20" height="8"
          rx="4"
          fill="var(--text-soft)"
          opacity=".45"/>

    <circle cx="278" cy="405" r="4" fill="var(--accent-3)"/>

  </g>


  <!-- =========================================================
       GLASS HIGHLIGHTS
       ========================================================= -->

  <!-- Top reflection -->
  <path d="M143 84 H369"
        stroke="white"
        stroke-width="3"
        stroke-linecap="round"
        opacity=".42"/>

  <!-- Bottom reflection -->
  <path d="
    M137 426
    C195 445 318 445 375 418"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    opacity=".12"/>

</svg>
